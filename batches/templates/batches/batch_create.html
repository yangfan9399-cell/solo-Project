<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建批次 - 入境动物隔离观察与放行系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans SC', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50">
    <nav class="bg-[#1e3a5f] shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-4">
                    <a href="{% url 'batches:list' %}" class="text-white hover:text-[#f59e0b] transition-all">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                        </svg>
                    </a>
                    <h1 class="text-white font-bold text-xl">创建新批次</h1>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-[#f59e0b] text-sm">{{ user.full_name }} ({{ user.get_role_display }})</span>
                    <a href="{% url 'accounts:logout' %}" 
                       class="bg-[#ef4444] text-white px-4 py-2 rounded-lg text-sm hover:bg-red-600 transition-all">
                        登出
                    </a>
                </div>
            </div>
        </div>
    </nav>
    
    <div class="max-w-3xl mx-auto px-4 py-8">
        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-4 rounded-lg {% if message.tags == 'success' %}bg-green-100 text-green-700{% elif message.tags == 'error' %}bg-red-100 text-red-700{% else %}bg-blue-100 text-blue-700{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="bg-[#1e3a5f] px-6 py-4">
                <h2 class="text-white font-bold">批次信息</h2>
            </div>
            
            <form method="post" action="{% url 'batches:create' %}" class="p-6 space-y-6">
                {% csrf_token %}
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="batch_number" class="block text-sm font-medium text-gray-700 mb-2">批次号 *</label>
                        <input type="text" 
                               id="batch_number" 
                               name="batch_number" 
                               required
                               pattern="BATCH-[0-9]{4}-[0-9]{3}"
                               placeholder="格式: BATCH-2024-001"
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#1e3a5f] focus:border-transparent">
                    </div>
                    
                    <div>
                        <label for="animal_type" class="block text-sm font-medium text-gray-700 mb-2">动物种类 *</label>
                        <select id="animal_type" 
                                name="animal_type" 
                                required
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#1e3a5f] focus:border-transparent">
                            <option value="">请选择</option>
                            <option value="牛">牛</option>
                            <option value="羊">羊</option>
                            <option value="猪">猪</option>
                            <option value="马">马</option>
                            <option value="鸡">鸡</option>
                            <option value="鸭">鸭</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    
                    <div>
                        <label for="quantity" class="block text-sm font-medium text-gray-700 mb-2">数量 *</label>
                        <input type="number" 
                               id="quantity" 
                               name="quantity" 
                               required
                               min="1"
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#1e3a5f] focus:border-transparent">
                    </div>
                    
                    <div>
                        <label for="origin_country" class="block text-sm font-medium text-gray-700 mb-2">来源国 *</label>
                        <select id="origin_country" 
                                name="origin_country" 
                                required
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#1e3a5f] focus:border-transparent">
                            <option value="">请选择</option>
                            <option value="澳大利亚">澳大利亚</option>
                            <option value="新西兰">新西兰</option>
                            <option value="美国">美国</option>
                            <option value="德国">德国</option>
                            <option value="荷兰">荷兰</option>
                            <option value="日本">日本</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    
                    <div>
                        <label for="entry_date" class="block text-sm font-medium text-gray-700 mb-2">入境日期 *</label>
                        <input type="date" 
                               id="entry_date" 
                               name="entry_date" 
                               required
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#1e3a5f] focus:border-transparent">
                    </div>
                    
                    <div>
                        <label for="quarantine_site" class="block text-sm font-medium text-gray-700 mb-2">隔离场 *</label>
                        <select id="quarantine_site" 
                                name="quarantine_site" 
                                required
                                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#1e3a5f] focus:border-transparent">
                            <option value="">请选择</option>
                            <option value="北京隔离场A区">北京隔离场A区</option>
                            <option value="上海隔离场B区">上海隔离场B区</option>
                            <option value="广州隔离场C区">广州隔离场C区</option>
                            <option value="深圳隔离场D区">深圳隔离场D区</option>
                        </select>
                    </div>
                </div>
                
                <div class="flex justify-end space-x-4 pt-6">
                    <a href="{% url 'batches:list' %}" 
                       class="px-6 py-3 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition-all">
                        取消
                    </a>
                    <button type="submit" 
                            class="px-6 py-3 bg-[#1e3a5f] text-white rounded-lg font-medium hover:bg-[#2d5a87] transition-all">
                        创建批次
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
