<div id="htmx-loading" class="fixed inset-0 bg-gray-900/50 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-xl p-6 flex flex-col items-center shadow-2xl">
        <div class="spinner w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full"></div>
        <p class="mt-3 text-sm text-gray-600">加载中...</p>
    </div>
</div>

<style>
    .spinner {
        animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
        to { transform: rotate(360deg); }
    }
</style>

<script>
    document.addEventListener('htmx:beforeRequest', function() {
        document.getElementById('htmx-loading').classList.remove('hidden');
    });
    document.addEventListener('htmx:afterRequest', function() {
        document.getElementById('htmx-loading').classList.add('hidden');
    });
</script>
