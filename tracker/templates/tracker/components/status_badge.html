{% with status=instrument.status %}
<span class="inline-flex items-center rounded-full px-3 py-1 text-sm font-medium
    {% if status == 'registered' %}bg-green-100 text-green-800
    {% elif status == 'in_use' %}bg-blue-100 text-blue-800
    {% elif status == 'cleaning' %}bg-yellow-100 text-yellow-800
    {% elif status == 'sterilizing' %}bg-orange-100 text-orange-800
    {% elif status == 'pending_release' %}bg-purple-100 text-purple-800
    {% elif status == 'expired' %}bg-red-100 text-red-800
    {% elif status == 'recalled' %}bg-red-100 text-red-800
    {% else %}bg-gray-100 text-gray-800
    {% endif %}">
    {{ instrument.get_status_display }}
</span>
{% endwith %}
