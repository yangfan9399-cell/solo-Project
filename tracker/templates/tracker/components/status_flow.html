{% with status=instrument.status %}
<div class="bg-white rounded-xl border border-gray-200 p-6">
    <h3 class="text-sm font-semibold text-gray-500 mb-4">状态流转</h3>

    <div class="flex items-center flex-wrap gap-1">
        <div class="flex items-center px-3 py-1.5 rounded-full text-xs font-medium
            {% if status == 'registered' %}bg-green-100 text-green-800 ring-2 ring-green-400{% else %}bg-gray-100 text-gray-500{% endif %}">
            在库
        </div>
        <svg class="w-4 h-4 text-gray-400 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>
        <div class="flex items-center px-3 py-1.5 rounded-full text-xs font-medium
            {% if status == 'in_use' %}bg-blue-100 text-blue-800 ring-2 ring-blue-400{% else %}bg-gray-100 text-gray-500{% endif %}">
            使用中
        </div>
        <svg class="w-4 h-4 text-gray-400 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>
        <div class="flex items-center px-3 py-1.5 rounded-full text-xs font-medium
            {% if status == 'cleaning' %}bg-yellow-100 text-yellow-800 ring-2 ring-yellow-400{% else %}bg-gray-100 text-gray-500{% endif %}">
            清洗中
        </div>
        <svg class="w-4 h-4 text-gray-400 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>
        <div class="flex items-center px-3 py-1.5 rounded-full text-xs font-medium
            {% if status == 'sterilizing' %}bg-orange-100 text-orange-800 ring-2 ring-orange-400{% else %}bg-gray-100 text-gray-500{% endif %}">
            灭菌中
        </div>
        <svg class="w-4 h-4 text-gray-400 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>
        <div class="flex items-center px-3 py-1.5 rounded-full text-xs font-medium
            {% if status == 'pending_release' %}bg-purple-100 text-purple-800 ring-2 ring-purple-400{% else %}bg-gray-100 text-gray-500{% endif %}">
            待放行
        </div>
        <svg class="w-4 h-4 text-gray-400 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>
        <div class="flex items-center px-3 py-1.5 rounded-full text-xs font-medium
            {% if status == 'registered' %}bg-green-100 text-green-800 ring-2 ring-green-400{% else %}bg-gray-100 text-gray-500{% endif %}">
            在库
        </div>
    </div>

    <div class="mt-4 pt-4 border-t border-gray-100 flex items-center flex-wrap gap-1">
        <div class="flex items-center px-3 py-1.5 rounded-full text-xs font-medium
            {% if status == 'registered' %}bg-green-100 text-green-800 ring-2 ring-green-400{% else %}bg-gray-100 text-gray-500{% endif %}">
            在库
        </div>
        <svg class="w-4 h-4 text-gray-400 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>
        <div class="flex items-center px-3 py-1.5 rounded-full text-xs font-medium
            {% if status == 'expired' %}bg-red-100 text-red-800 ring-2 ring-red-400{% else %}bg-gray-100 text-gray-500{% endif %}">
            已过期
        </div>
        <svg class="w-4 h-4 text-gray-400 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"/></svg>
        <div class="flex items-center px-3 py-1.5 rounded-full text-xs font-medium
            {% if status == 'recalled' %}bg-red-100 text-red-800 ring-2 ring-red-400{% else %}bg-gray-100 text-gray-500{% endif %}">
            已召回
        </div>
    </div>
</div>
{% endwith %}
