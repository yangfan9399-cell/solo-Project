version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: copyright_platform_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/copyright_platform_development
      RAILS_ENV: development
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules

volumes:
  postgres_data:
  app_node_modules: