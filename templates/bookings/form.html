{% extends "base.html" %}

{% block title %}{{ '编辑预订' if booking else '新建预订' }} - 酒店会务管理系统{% endblock %}

{% block page_title %}{{ '编辑预订' if booking else '新建预订' }}{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-header__left">
        <h2 class="page-header__title">{{ '编辑预订' if booking else '新建预订' }}</h2>
    </div>
    <div class="page-header__actions">
        <a href="{{ url_for('bookings.list_bookings') if not booking else url_for('bookings.detail', id=booking.id) }}" class="btn btn--ghost">取消</a>
    </div>
</div>

<div class="card">
    <div class="card__body">
        <form method="POST" class="form">
            <div class="form__group">
                <label class="form__label" for="title">会议名称</label>
                <input type="text" id="title" name="title" class="form__input" value="{{ booking.title if booking else '' }}" required>
            </div>

            <div class="form__group">
                <label class="form__label" for="room_id">会议室</label>
                <select id="room_id" name="room_id" class="form__input" required>
                    <option value="">请选择会议室</option>
                    {% for room in rooms %}
                    <option value="{{ room.id }}" {% if booking and booking.room_id == room.id %}selected{% endif %}>{{ room.name }}（{{ room.capacity }}人）</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form__row">
                <div class="form__group">
                    <label class="form__label" for="client_name">客户名称</label>
                    <input type="text" id="client_name" name="client_name" class="form__input" value="{{ booking.client_name if booking else '' }}" required>
                </div>
                <div class="form__group">
                    <label class="form__label" for="client_contact">联系方式</label>
                    <input type="text" id="client_contact" name="client_contact" class="form__input" value="{{ booking.client_contact if booking else '' }}">
                </div>
            </div>

            <div class="form__group">
                <label class="form__label" for="attendees">参会人数</label>
                <input type="number" id="attendees" name="attendees" class="form__input" min="0" value="{{ booking.attendees if booking else 0 }}">
            </div>

            <div class="form__row">
                <div class="form__group">
                    <label class="form__label" for="start_time">开始时间</label>
                    <input type="datetime-local" id="start_time" name="start_time" class="form__input" value="{{ booking.start_time.strftime('%Y-%m-%dT%H:%M') if booking else '' }}" required>
                </div>
                <div class="form__group">
                    <label class="form__label" for="end_time">结束时间</label>
                    <input type="datetime-local" id="end_time" name="end_time" class="form__input" value="{{ booking.end_time.strftime('%Y-%m-%dT%H:%M') if booking else '' }}" required>
                </div>
            </div>

            <div class="form__group">
                <label class="form__label" for="notes">备注</label>
                <textarea id="notes" name="notes" class="form__input form__textarea" rows="4">{{ booking.notes if booking else '' }}</textarea>
            </div>

            <div class="form__actions">
                <button type="submit" class="btn btn--primary">{{ '保存修改' if booking else '创建预订' }}</button>
                <a href="{{ url_for('bookings.list_bookings') if not booking else url_for('bookings.detail', id=booking.id) }}" class="btn btn--ghost">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
