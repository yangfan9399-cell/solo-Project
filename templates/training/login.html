{% extends "training/base.html" %}

{% block login_content %}
<div class="login-container">
    <div class="login-box">
        <h2>🏢 企业培训管理系统</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" required>
            </div>
            {% if form.errors %}
            <div class="alert alert-error">
                用户名或密码错误，请重试。
            </div>
            {% endif %}
            <button type="submit" class="btn btn-primary">登录</button>
        </form>
        <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #e2e8f0; font-size: 0.85rem; color: #718096;">
            <p style="margin-bottom: 0.5rem; font-weight: 500; color: #4a5568;">测试账号：</p>
            <p>员工: employee1 / test123456</p>
            <p>培训管理员: admin_train / test123456</p>
            <p>讲师: instructor1 / test123456</p>
            <p>HR: hr1 / test123456</p>
        </div>
    </div>
</div>
{% endblock %}
