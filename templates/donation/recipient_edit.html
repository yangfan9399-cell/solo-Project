{% extends 'donation/base.html' %}

{% block content %}
    <div class="card">
        <h2>编辑受赠方: {{ recipient.name }}</h2>
        
        <form method="post">
            {% csrf_token %}
            
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;">
                <div class="form-group">
                    <label>名称</label>
                    <input type="text" name="name" value="{{ recipient.name }}" required>
                </div>
                <div class="form-group">
                    <label>联系人</label>
                    <input type="text" name="contact" value="{{ recipient.contact }}">
                </div>
                <div class="form-group">
                    <label>电话</label>
                    <input type="text" name="phone" value="{{ recipient.phone }}">
                </div>
                <div class="form-group">
                    <label>地址</label>
                    <textarea name="address" rows="3">{{ recipient.address }}</textarea>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary">保存</button>
            <a href="/recipient/list/" class="btn btn-secondary">取消</a>
        </form>
    </div>
{% endblock %}
