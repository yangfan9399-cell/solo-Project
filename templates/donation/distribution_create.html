{% extends 'donation/base.html' %}

{% block content %}
    <div class="card">
        <h2>创建分配计划</h2>
        
        <form method="post" id="distribution-form">
            {% csrf_token %}
            
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem;">
                <div class="form-group">
                    <label>选择批次</label>
                    <select name="batch" required>
                        <option value="">请选择批次</option>
                        {% for b in batches %}
                        <option value="{{ b.id }}" data-quantity="{{ b.available_quantity }}">
                            {{ b.batch_number }} - {{ b.material.name }} (可用: {{ b.available_quantity }} {{ b.material.unit }})
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>选择项目</label>
                    <select name="project" required>
                        <option value="">请选择项目</option>
                        {% for p in projects %}
                        <option value="{{ p.id }}">{{ p.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label>选择受赠方</label>
                    <select name="recipient" required>
                        <option value="">请选择受赠方</option>
                        {% for r in recipients %}
                        <option value="{{ r.id }}">{{ r.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem;">
                <div class="form-group">
                    <label>分配数量</label>
                    <input type="number" name="quantity" required min="1" id="quantity-input">
                </div>
                <div class="form-group">
                    <label>计划日期</label>
                    <input type="date" name="planned_date" required>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary">创建分配</button>
            <a href="/distribution/list/" class="btn btn-secondary">取消</a>
        </form>
    </div>

    <script>
        document.getElementById('distribution-form').addEventListener('submit', function(e) {
            const batchSelect = document.querySelector('select[name="batch"]');
            const selectedOption = batchSelect.options[batchSelect.selectedIndex];
            const maxQuantity = parseInt(selectedOption.dataset.quantity);
            const quantity = parseInt(document.getElementById('quantity-input').value);
            
            if (quantity > maxQuantity) {
                alert('分配数量不能超过可用库存');
                e.preventDefault();
            }
        });
    </script>
{% endblock %}
