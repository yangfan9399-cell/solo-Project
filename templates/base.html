<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}城市照明巡检管理平台{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline; }
        .htmx-request.htmx-indicator { display: inline; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    {% if user.is_authenticated %}
    <nav class="bg-blue-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-8">
                    <a href="{% url 'dashboard' %}" class="text-xl font-bold">💡 城市照明巡检平台</a>
                    <div class="hidden md:flex space-x-4">
                        <a href="{% url 'dashboard' %}" class="hover:bg-blue-600 px-3 py-2 rounded">仪表盘</a>
                        <a href="{% url 'work_order_list' %}" class="hover:bg-blue-600 px-3 py-2 rounded">工单管理</a>
                        <a href="{% url 'review' %}" class="hover:bg-blue-600 px-3 py-2 rounded">数据复盘</a>
                        <a href="{% url 'light_pole_list' %}" class="hover:bg-blue-600 px-3 py-2 rounded">灯杆管理</a>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-sm">{{ user.get_full_name|default:user.username }} ({{ user.get_role_display }})</span>
                    <a href="{% url 'logout' %}" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded">退出</a>
                </div>
            </div>
        </div>
    </nav>
    {% endif %}
    
    <main class="{% if user.is_authenticated %}max-w-7xl mx-auto px-4 py-6{% endif %}">
        {% block content %}{% endblock %}
    </main>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
