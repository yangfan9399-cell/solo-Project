<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}低多边形城堡攻防{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 min-h-screen">
    <nav class="bg-slate-800/80 backdrop-blur-sm border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="{% url 'dashboard' %}" class="flex items-center gap-2">
                <span class="text-3xl">🏰</span>
                <span class="text-xl font-bold text-white">低多边形城堡攻防</span>
            </a>
            {% if user.is_authenticated %}
            <div class="flex items-center gap-4">
                <span class="text-slate-300">
                    <span class="text-yellow-400">👤</span> {{ user.profile.display_name }}
                </span>
                <a href="{% url 'dashboard' %}" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg transition">
                    控制台
                </a>
                <a href="{% url 'history_view' %}" class="px-4 py-2 bg-slate-600 hover:bg-slate-700 text-white rounded-lg transition">
                    历史记录
                </a>
                <a href="{% url 'leaderboard' %}" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg transition">
                    排行榜
                </a>
                <a href="{% url 'logout' %}" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg transition">
                    退出
                </a>
            </div>
            {% endif %}
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-6 text-slate-500 text-sm">
        <p>🏰 低多边形城堡攻防异步游戏 - 策略塔防</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
