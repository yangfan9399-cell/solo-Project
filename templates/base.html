<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}纸上邮差路线折叠游戏{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <div class="container">
            <h1 class="logo">📮 纸上邮差</h1>
            <nav class="main-nav">
                <a href="{% url 'index' %}">首页</a>
                <a href="{% url 'level_list' %}">关卡列表</a>
                <a href="{% url 'level_editor' %}">关卡编辑器</a>
                <a href="/admin/">管理后台</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>纸上邮差路线折叠游戏 | Django 5 + SQLite</p>
        </div>
    </footer>

    <script src="{% static 'js/utils.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
