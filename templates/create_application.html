{% extends 'base.html' %}

{% block title %}提交申领 - 实验耗材管理系统{% endblock %}

{% block content %}
    <h2>提交耗材申领</h2>

    <div class="card">
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>耗材</label>
                <select name="consumable" required>
                    <option value="">请选择耗材</option>
                    {% for consumable in form.fields.consumable.queryset %}
                    <option value="{{ consumable.pk }}" data-danger-level="{{ consumable.danger_level }}">
                        {{ consumable.name }} ({{ consumable.category.get_name_display }} - {{ consumable.get_danger_level_display }})
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>领用数量</label>
                <input type="number" name="requested_quantity" min="1" required>
            </div>
            <div class="form-group">
                <label>用途说明</label>
                <textarea name="purpose" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">提交申请</button>
            <a href="{% url 'application_list' %}" class="btn btn-secondary" style="margin-left: 1rem;">取消</a>
        </form>
    </div>
{% endblock %}
