{% extends "base.html" %}

{% block title %}登录 - 环卫车辆清运管理系统{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 4rem auto;">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 1.5rem; color: #2c3e50;">系统登录</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" required autofocus>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" required>
            </div>
            {% if form.errors %}
            <div class="message message-error" style="margin-bottom: 1rem;">
                用户名或密码错误，请重试。
            </div>
            {% endif %}
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">登 录</button>
        </form>
        <p style="text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #999;">
            默认账号：admin / admin123
        </p>
    </div>
</div>
{% endblock %}
