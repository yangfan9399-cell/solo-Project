{% extends 'base.html' %}

{% block title %}工单列表 - 城市照明巡检管理平台{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-800">工单管理</h1>
        <button onclick="location.href='{% url 'work_order_create' %}'" 
                class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
            + 新建工单
        </button>
    </div>
    
    <div class="bg-white rounded-xl shadow p-6">
        <h3 class="text-lg font-semibold mb-4">筛选条件</h3>
        <form method="get" class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">状态</label>
                {{ filter_form.status }}
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">故障类型</label>
                {{ filter_form.fault_type }}
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">片区</label>
                {{ filter_form.area }}
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">关键词</label>
                {{ filter_form.keyword }}
            </div>
            <div class="md:col-span-4 flex gap-2">
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">筛选</button>
                <a href="{% url 'work_order_list' %}" class="bg-gray-200 text-gray-700 px-4 py-2 rounded hover:bg-gray-300">重置</a>
            </div>
        </form>
    </div>
    
    <div class="bg-white rounded-xl shadow overflow-hidden">
        <div id="order-list">
            {% include 'partials/order_list.html' %}
        </div>
    </div>
</div>
{% endblock %}
