{% if passed %}
<div class="alert alert-success">
    <div class="alert-title">✓ 资格核验通过</div>
    <div class="alert-body">
        <p>您的读者类型（{{ reader_type }}）可以预约{{ book_rarity }}级别的珍本。</p>
    </div>
</div>
{% else %}
<div class="alert alert-danger">
    <div class="alert-title">✕ 资格核验未通过</div>
    <div class="alert-body">
        <p>{{ issues|join:"；" }}</p>
        {% if required_proofs %}
        <p style="margin-top: 12px; font-weight: 500;">所需证明材料：</p>
        <ul style="margin-top: 8px; padding-left: 24px;">
            {% for proof in required_proofs %}
            <li>{{ proof }}</li>
            {% endfor %}
        </ul>
        <p style="margin-top: 8px; font-size: 0.85rem; color: var(--color-text-muted);">
            请携带相关证明材料到馆办理，或联系工作人员咨询。
        </p>
        {% endif %}
    </div>
</div>
{% endif %}
