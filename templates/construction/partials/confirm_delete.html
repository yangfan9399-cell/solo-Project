<div class="modal show d-block" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-trash me-2 text-danger"></i>删除计划</h5>
                <button type="button" class="btn-close" onclick="document.querySelector('.modal').remove()"></button>
            </div>
            <div class="modal-body">
                <p>确定要删除施工计划 <strong>{{ plan.title }}</strong> 吗？</p>
                <p class="text-danger small mb-0">此操作不可撤销！</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" onclick="document.querySelector('.modal').remove()">取消</button>
                <form method="post" action="{% url 'construction:plan_delete' plan.pk %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">确认删除</button>
                </form>
            </div>
        </div>
    </div>
</div>
<div class="modal-backdrop fade show"></div>
