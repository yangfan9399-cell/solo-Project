{% extends 'base.html' %}

{% block title %}登录 - 城市照明巡检管理平台{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-500 to-blue-700">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <div class="text-6xl mb-4">💡</div>
            <h1 class="text-2xl font-bold text-gray-800">城市照明巡检管理平台</h1>
            <p class="text-gray-500 mt-2">请登录以继续</p>
        </div>
        
        {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
            {{ error }}
        </div>
        {% endif %}
        
        <form method="post" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">用户名</label>
                <input type="text" name="username" required 
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">密码</label>
                <input type="password" name="password" required 
                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
            </div>
            <button type="submit" 
                    class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors">
                登录
            </button>
        </form>
        
        <div class="mt-6 text-center text-sm text-gray-500">
            <p>测试账号：</p>
            <p>admin / admin123 (管理员)</p>
            <p>inspector / inspector123 (巡检员)</p>
            <p>reviewer / reviewer123 (复核人)</p>
        </div>
    </div>
</div>
{% endblock %}
