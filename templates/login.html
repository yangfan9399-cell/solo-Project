<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 实验耗材管理系统</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); padding: 2rem; width: 100%; max-width: 400px; }
        .login-box h1 { text-align: center; margin-bottom: 2rem; color: #2c3e50; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        .form-group input { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; }
        .btn { width: 100%; padding: 0.75rem; border: none; border-radius: 6px; background: #3498db; color: white; font-size: 1rem; cursor: pointer; }
        .btn:hover { background: #2980b9; }
        .alert { padding: 1rem; border-radius: 6px; margin-bottom: 1rem; background: #f8d7da; color: #721c24; }
        .credentials { margin-top: 1.5rem; padding: 1rem; background: #f8f9fa; border-radius: 6px; font-size: 0.9rem; }
        .credentials h4 { margin-bottom: 0.5rem; }
        .credentials ul { list-style: none; padding-left: 0; }
        .credentials li { margin-bottom: 0.25rem; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>实验耗材管理系统</h1>
        {% if messages %}
            {% for message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn">登录</button>
        </form>
        <div class="credentials">
            <h4>测试账户：</h4>
            <ul>
                <li><strong>教师：</strong>teacher / password</li>
                <li><strong>库管员：</strong>stock / password</li>
                <li><strong>安全员：</strong>safety / password</li>
                <li><strong>实验室负责人：</strong>lab / password</li>
            </ul>
        </div>
    </div>
</body>
</html>
