<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 低多边形城堡攻防</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-900 to-purple-900 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="text-7xl mb-4 animate-bounce">🏰</div>
            <h1 class="text-4xl font-bold text-white mb-2">低多边形城堡攻防</h1>
            <p class="text-slate-400">异步策略塔防游戏</p>
        </div>

        <div class="bg-slate-800/60 backdrop-blur-lg rounded-2xl p-8 border border-slate-700 shadow-2xl">
            <h2 class="text-2xl font-bold text-white mb-6 text-center">登录或创建账号</h2>

            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-slate-300 mb-2">用户名</label>
                    <input type="text" name="username" required
                           class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600 rounded-xl text-white placeholder-slate-400 focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                           placeholder="输入用户名...">
                </div>
                <div>
                    <label class="block text-slate-300 mb-2">密码 (默认: password123)</label>
                    <input type="password" name="password" value="password123"
                           class="w-full px-4 py-3 bg-slate-700/50 border border-slate-600 rounded-xl text-white placeholder-slate-400 focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
                           placeholder="输入密码...">
                </div>
                <button type="submit"
                        class="w-full py-4 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold rounded-xl transition transform hover:scale-105 shadow-lg">
                    🎮 进入游戏
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-700">
                <p class="text-slate-400 text-sm text-center mb-3">快速体验演示账号：</p>
                <div class="bg-slate-900/50 rounded-lg p-3 text-center">
                    <p class="text-yellow-400 font-mono">demo_player / password123</p>
                </div>
            </div>
        </div>

        <div class="mt-8 grid grid-cols-2 gap-4 text-center">
            <div class="bg-slate-800/40 rounded-xl p-4">
                <div class="text-3xl mb-2">⚔️</div>
                <h3 class="text-white font-semibold">城墙陷阱</h3>
                <p class="text-slate-400 text-sm">布置5种陷阱防御敌人</p>
            </div>
            <div class="bg-slate-800/40 rounded-xl p-4">
                <div class="text-3xl mb-2">👷</div>
                <h3 class="text-white font-semibold">工匠任务</h3>
                <p class="text-slate-400 text-sm">派遣工匠获取资源加成</p>
            </div>
            <div class="bg-slate-800/40 rounded-xl p-4">
                <div class="text-3xl mb-2">📊</div>
                <h3 class="text-white font-semibold">自动战报</h3>
                <p class="text-slate-400 text-sm">详细战斗数据记录</p>
            </div>
            <div class="bg-slate-800/40 rounded-xl p-4">
                <div class="text-3xl mb-2">🎬</div>
                <h3 class="text-white font-semibold">防守回放</h3>
                <p class="text-slate-400 text-sm">完整战局回放系统</p>
            </div>
        </div>
    </div>
</body>
</html>
