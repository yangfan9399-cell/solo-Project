<div class="space-y-4">
    {% for note in reading.field_notes.all %}
    <div class="bg-gray-50 rounded-lg p-4">
        <div class="flex items-start justify-between mb-3">
            <div class="flex items-center">
                <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center mr-3">
                    <span class="text-blue-600 font-bold">{{ note.reader.username|first|upper }}</span>
                </div>
                <div>
                    <p class="font-medium text-gray-900">{{ note.reader.username }}</p>
                    <p class="text-xs text-gray-500">{{ note.created_at|date:"Y-m-d H:i:s" }}</p>
                </div>
            </div>
        </div>
        <p class="text-sm text-gray-700 whitespace-pre-wrap">{{ note.note }}</p>
        {% if note.photo %}
        <div class="mt-3">
            <img src="{{ note.photo.url }}" alt="现场照片" class="max-w-xs rounded-lg shadow-sm">
        </div>
        {% endif %}
    </div>
    {% empty %}
    <div class="text-center py-8 text-gray-500">
        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
        </svg>
        <p class="mt-2">暂无现场说明记录</p>
    </div>
    {% endfor %}
</div>
