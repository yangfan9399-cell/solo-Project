<div class="bg-white rounded-xl shadow p-6">
    <form hx-post="{% url 'work_order_create' %}" hx-target="#order-form" class="space-y-6">
        {% csrf_token %}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">工单标题</label>
                {{ form.title }}
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">灯杆</label>
                {{ form.light_pole }}
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">故障来源</label>
                {{ form.fault_source }}
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">故障类型</label>
                {{ form.fault_type }}
            </div>
            <div class="md:col-span-2">
                <label class="block text-sm font-medium text-gray-700 mb-1">故障描述</label>
                {{ form.description }}
            </div>
        </div>
        <div class="flex justify-end gap-4 pt-4 border-t">
            <button type="button" class="px-6 py-2 border rounded-lg hover:bg-gray-50"
                    hx-get="{% url 'work_order_list' %}" hx-target="#main-content">
                取消
            </button>
            <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                创建工单
            </button>
        </div>
    </form>
</div>
