<div id="temperature-records">
    <ul class="temp-list">
        {% for temp in batch.temperature_records.all|slice:":10" %}
        <li class="temp-item">
            <div>
                <span class="temp-value">{{ temp.temperature }}℃</span>
                <span class="temp-location" style="margin-left:8px;">{{ temp.location|default:"" }}</span>
            </div>
            <span class="temp-time">{{ temp.recorded_at|date:"m-d H:i" }}</span>
        </li>
        {% empty %}
        <li style="color:#adb5bd;font-size:13px;padding:10px 0;">暂无温度记录</li>
        {% endfor %}
    </ul>
</div>
