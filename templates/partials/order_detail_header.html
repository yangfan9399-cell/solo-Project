<div id="order-header">
    <div class="flex justify-between items-center mb-4">
        <div>
            <h1 class="text-2xl font-bold text-gray-800">工单详情</h1>
            <p class="text-gray-500">{{ order.order_number }}</p>
        </div>
        <div class="flex gap-2">
            <span class="px-3 py-1 rounded text-sm
                {% if order.status == 'archived' %}bg-green-100 text-green-700
                {% elif order.status == 'pending' %}bg-yellow-100 text-yellow-700
                {% elif order.status == 'returned' %}bg-red-100 text-red-700
                {% else %}bg-blue-100 text-blue-700{% endif %}">
                {{ order.get_status_display }}
            </span>
        </div>
    </div>
</div>
