{% extends "base.html" %}

{% block title %}投诉解决{% endblock %}

{% block content %}
<h2 class="page-title">投诉解决</h2>

<div class="card">
    <div style="margin-bottom: 1.5rem;">
        <h4>{{ complaint.get_complaint_type_display }} - {{ complaint.station.name }}</h4>
        <p style="color: #666; font-size: 0.9rem; margin-top: 0.5rem;">
            投诉人：{{ complaint.complainant }}<br>
            投诉时间：{{ complaint.reported_at|date:"Y-m-d H:i" }}
        </p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>解决说明 *</label>
            <textarea name="resolution_notes" rows="4" required placeholder="请详细描述解决措施和结果..."></textarea>
        </div>
        <div style="display: flex; gap: 1rem;">
            <button type="submit" class="btn btn-success">标记已解决</button>
            <a href="{% url 'operations:complaint_detail' complaint.pk %}" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>
{% endblock %}
