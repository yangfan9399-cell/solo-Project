<div class="station-item" id="station-{{ station.id }}" style="background: #f0f7ff; border-color: #3498db;">
    <div style="flex: 1;">
        <strong style="color: #2980b9;">📍 {{ station.order }}. {{ station.name }}</strong>
        <form method="post"
              hx-post="{% url 'operations:checkin_create' assignment.pk station.pk %}"
              hx-target="#station-{{ station.id }}"
              hx-swap="outerHTML"
              style="margin-top: 0.5rem;">
            {% csrf_token %}
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;">
                <div style="flex: 1; min-width: 100px;">
                    <select name="status" style="width: 100%; padding: 0.25rem; font-size: 0.85rem; border: 1px solid #ddd; border-radius: 4px;">
                        {% for value, label in status_choices %}
                        <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div style="flex: 1; min-width: 100px;">
                    <input type="number" name="waste_weight" placeholder="重量(kg)" step="0.1"
                           style="width: 100%; padding: 0.25rem; font-size: 0.85rem; border: 1px solid #ddd; border-radius: 4px;">
                </div>
                <div style="flex: 2; min-width: 150px;">
                    <input type="text" name="notes" placeholder="备注"
                           style="width: 100%; padding: 0.25rem; font-size: 0.85rem; border: 1px solid #ddd; border-radius: 4px;">
                </div>
                <button type="submit" class="btn btn-sm btn-success">确认签到</button>
                <button type="button" class="btn btn-sm btn-secondary"
                        hx-get="{% url 'operations:checkin_cancel' assignment.pk station.pk %}"
                        hx-target="#station-{{ station.id }}"
                        hx-swap="outerHTML">取消</button>
            </div>
        </form>
    </div>
</div>
