{% extends "base.html" %}

{% block title %}新建派车任务 - 环卫车辆清运管理系统{% endblock %}

{% block content %}
<h2 class="page-title">新建派车任务</h2>

<div class="card">
    <form method="post">
        {% csrf_token %}
        <div class="form-row">
            <div class="form-group">
                <label>清运路线 *</label>
                <select name="route" required>
                    <option value="">请选择路线</option>
                    {% for route in routes %}
                    <option value="{{ route.id }}">
                        {{ route.code }} - {{ route.name }} ({{ route.station_count }}站 / {{ route.district.name }})
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>车辆 *</label>
                <select name="vehicle" required>
                    <option value="">请选择车辆</option>
                    {% for vehicle in vehicles %}
                    <option value="{{ vehicle.id }}">
                        {{ vehicle.plate_number }} - {{ vehicle.vehicle_type }} ({{ vehicle.capacity }}吨)
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>司机 *</label>
                <select name="driver" required>
                    <option value="">请选择司机</option>
                    {% for driver in drivers %}
                    <option value="{{ driver.id }}">
                        {{ driver.profile.real_name|default:driver.username }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label>派车日期</label>
                <input type="date" name="assigned_date" value="{{ today|date:'Y-m-d' }}">
            </div>
        </div>
        <div class="form-group">
            <label>计划发车时间</label>
            <input type="time" name="scheduled_start_time">
        </div>
        <div class="form-group">
            <label>备注</label>
            <textarea name="notes" rows="3" placeholder="请输入备注信息..."></textarea>
        </div>
        <div style="display: flex; gap: 1rem;">
            <button type="submit" class="btn btn-primary">提交派车</button>
            <a href="{% url 'operations:assignment_list' %}" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>
{% endblock %}
