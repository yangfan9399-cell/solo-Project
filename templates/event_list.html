{% extends "base.html" %}

{% block title %}事件列表 - 体育场馆伤情事件管理系统{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-900">伤情事件列表</h1>
        <a href="{{ url_for('event_create') }}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700">
            ➕ 新建伤情上报
        </a>
    </div>

    <div class="bg-white shadow rounded-lg p-4">
        <form hx-get="{{ url_for('event_list') }}" hx-trigger="change" hx-target="#events-container" class="flex flex-wrap gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">状态</label>
                <select name="status" class="border rounded-md px-3 py-2 text-sm">
                    <option value="">全部状态</option>
                    {% for s in status_list %}
                    <option value="{{ s }}">{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">严重程度</label>
                <select name="severity" class="border rounded-md px-3 py-2 text-sm">
                    <option value="">全部</option>
                    {% for s in severity_list %}
                    <option value="{{ s }}">{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">风险等级</label>
                <select name="risk" class="border rounded-md px-3 py-2 text-sm">
                    <option value="">全部</option>
                    <option value="low">低风险</option>
                    <option value="medium">中风险</option>
                    <option value="high">高风险</option>
                </select>
            </div>
            <div class="flex items-end">
                <button type="submit" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-md hover:bg-gray-200 text-sm">
                    🔄 筛选
                </button>
            </div>
        </form>
    </div>

    <div id="events-container" class="bg-white shadow rounded-lg">
        {% include 'partials/event_list.html' %}
    </div>
</div>
{% endblock %}
