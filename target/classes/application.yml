server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:hoteldb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
  sql:
    init:
      mode: always

logging:
  level:
    com.hotel.maintenance: DEBUG
    org.hibernate.SQL: DEBUG
