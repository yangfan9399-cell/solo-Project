<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}山城缆车售票排队游戏{% endblock %}</title>
<style>
:root {
  --bg: #1a1a2e;
  --fg: #eaeaea;
  --accent: #e94560;
  --accent2: #0f3460;
  --card: #16213e;
  --border: #334155;
  --success: #4ade80;
  --warning: #fbbf24;
  --danger: #ef4444;
  --info: #60a5fa;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
}
a { color: var(--info); text-decoration: none; }
a:hover { text-decoration: underline; }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
nav {
  background: var(--card);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  gap: 24px;
  border-bottom: 2px solid var(--accent);
}
nav .logo {
  font-size: 1.4em;
  font-weight: bold;
  color: var(--accent);
}
nav a { color: var(--fg); opacity: 0.8; }
nav a:hover { opacity: 1; color: var(--accent); text-decoration: none; }
h1, h2, h3 { margin-bottom: 12px; }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 16px;
}
.btn {
  display: inline-block;
  padding: 8px 20px;
  border-radius: 8px;
  border: none;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #c73850; }
.btn-success { background: var(--success); color: #1a1a2e; }
.btn-success:hover { background: #3fcf73; }
.btn-warning { background: var(--warning); color: #1a1a2e; }
.btn-warning:hover { background: #e5ab1e; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { background: #dc2626; }
.btn-info { background: var(--info); color: #1a1a2e; }
.btn-info:hover { background: #4b91e0; }
.btn-sm { padding: 4px 12px; font-size: 12px; }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: 1fr 1fr 1fr; }
.grid-4 { grid-template-columns: 1fr 1fr 1fr 1fr; }
@media (max-width: 768px) {
  .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
}
.stat { text-align: center; }
.stat-value { font-size: 2em; font-weight: bold; color: var(--accent); }
.stat-label { font-size: 0.85em; opacity: 0.7; }
table {
  width: 100%;
  border-collapse: collapse;
}
th, td {
  padding: 8px 12px;
  text-align: left;
  border-bottom: 1px solid var(--border);
}
th { background: var(--accent2); font-weight: 600; }
tr:hover { background: rgba(255,255,255,0.03); }
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 0.75em;
  font-weight: 600;
}
.badge-success { background: var(--success); color: #1a1a2e; }
.badge-danger { background: var(--danger); color: #fff; }
.badge-warning { background: var(--warning); color: #1a1a2e; }
.badge-info { background: var(--info); color: #1a1a2e; }
.progress-bar {
  background: var(--border);
  border-radius: 8px;
  height: 20px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  border-radius: 8px;
  transition: width 0.3s;
}
input[type="number"], select {
  background: var(--bg);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 14px;
}
input[type="range"] {
  width: 100%;
  accent-color: var(--accent);
}
.mountain-bg {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 200px;
  background: linear-gradient(transparent, rgba(15,52,96,0.3));
  pointer-events: none;
  z-index: -1;
}
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<nav>
  <span class="logo">🚡 山城缆车</span>
  <a href="/">首页</a>
  <a href="/#levels">关卡选择</a>
</nav>
<div class="container">
{% block content %}{% endblock %}
</div>
<div class="mountain-bg"></div>
{% block extra_scripts %}{% endblock %}
</body>
</html>
