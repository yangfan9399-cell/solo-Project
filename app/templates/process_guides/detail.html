{% extends "base.html" %}

{% block title %}{{ guide.title }} - 工艺指导详情{% endblock %}

{% block content %}
<div style="margin-bottom: 1.5rem;">
  <a href="/process-guides" class="btn btn-outline">← 返回列表</a>
</div>

<div class="card">
  <div class="card-header">
    <h2>{{ guide.title }}</h2>
    <span class="badge badge-info">{{ guide.defect_category.value }}</span>
  </div>
  <div class="card-body">
    <div style="margin-bottom: 1rem; font-size: 0.875rem; color: var(--gray-500);">
      创建于 {{ guide.created_at.strftime('%Y-%m-%d %H:%M') }}
    </div>
    <div style="white-space: pre-wrap; line-height: 1.8;">
      {{ guide.content }}
    </div>
  </div>
</div>
{% endblock %}
