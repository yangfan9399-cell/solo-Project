spring.application.name=dorm-repair

server.port=8080

# ===== H2 嵌入式数据库（默认，无需安装）=====
spring.datasource.url=jdbc:h2:mem:dorm_repair;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ===== H2 控制台（访问 http://localhost:8080/h2-console）=====
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ===== PostgreSQL 配置（如需使用，取消注释并注释上面 H2 部分）=====
# spring.datasource.url=jdbc:postgresql://localhost:5432/dorm_repair
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

spring.mvc.format.date=yyyy-MM-dd HH:mm:ss
spring.mvc.static-path-pattern=/**
