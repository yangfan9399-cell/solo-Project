
server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/example_db
    driver-class-name: org.postgresql.Driver
    username: admin
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.example.petshipping: DEBUG
    org.hibernate.SQL: DEBUG
