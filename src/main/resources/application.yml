
server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/cinema_inspection
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  thymeleaf:
    mode: HTML
    encoding: UTF-8
    cache: false
    prefix: classpath:/templates/
    suffix: .html

logging:
  level:
    com.example.cinema: DEBUG
    org.hibernate.SQL: DEBUG
