server:
  port: 8080

spring:
  application:
    name: account-opening-due-diligence

  datasource:
    url: jdbc:h2:mem:bank_due_diligence;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML

  sql:
    init:
      mode: always

logging:
  level:
    com.bank: DEBUG
    org.springframework.security: INFO
