<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>器械包列表</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">器械追溯系统</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/">首页</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/packages">器械包列表</a></li>
                    <li class="nav-item"><a class="nav-link" href="/review">复盘统计</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-md-6">
                <h2>器械包列表</h2>
            </div>
            <div class="col-md-6 text-end">
                <form th:action="@{/packages}" method="get" class="form-inline">
                    <select name="status" class="form-select" onchange="this.form.submit()">
                        <option value="">全部状态</option>
                        <option th:each="status : ${statuses}" 
                                th:value="${status}" 
                                th:text="${T(com.example.instrument.util.StatusHelper).getStatusText(status)}"
                                th:selected="${statusFilter == status}">
                        </option>
                    </select>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>器械包编码</th>
                            <th>器械包名称</th>
                            <th>器械数量</th>
                            <th>灭菌批次</th>
                            <th>有效期</th>
                            <th>状态</th>
                            <th>更新时间</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="pkg : ${packages}">
                            <td th:text="${pkg.packageCode}"></td>
                            <td th:text="${pkg.packageName}"></td>
                            <td th:text="${instrumentsMap[pkg.id]?.size() ?: 0}"></td>
                            <td th:text="${latestBatchMap[pkg.id]?.batchNo ?: '-'}"></td>
                            <td>
                                <span th:if="${latestBatchMap[pkg.id]}">
                                    <span th:if="${latestBatchMap[pkg.id].expiryDate?.isBefore(#dates.createToday())}" class="text-danger">
                                        已过期: [[${#temporals.format(latestBatchMap[pkg.id].expiryDate, 'yyyy-MM-dd')}]]
                                    </span>
                                    <span th:else th:text="${#temporals.format(latestBatchMap[pkg.id].expiryDate, 'yyyy-MM-dd')}"></span>
                                </span>
                                <span th:else>-</span>
                            </td>
                            <td>
                                <span th:class="${T(com.example.instrument.util.StatusHelper).getBadgeClass(pkg.status)}" th:text="${T(com.example.instrument.util.StatusHelper).getStatusText(pkg.status)}"></span>
                            </td>
                            <td th:text="${#temporals.format(pkg.updateTime, 'yyyy-MM-dd HH:mm')}"></td>
                            <td>
                                <a th:href="@{/packages/{id}(id=${pkg.id})}" class="btn btn-sm btn-primary">详情</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
