<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发放器械包</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">器械追溯系统</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/">首页</a></li>
                    <li class="nav-item"><a class="nav-link" href="/packages">器械包列表</a></li>
                    <li class="nav-item"><a class="nav-link" href="/review">复盘统计</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card">
            <div class="card-header bg-success text-white">发放器械包</div>
            <div class="card-body">
                <h4>器械包: [[${package.packageName}]]</h4>
                <p class="text-muted">编码: [[${package.packageCode}]]</p>

                <div th:if="${isExpired}" class="alert alert-danger mb-4">
                    ⚠️ 警告：灭菌批次已过期，禁止发放！
                </div>

                <form th:action="@{/packages/{id}/issue(id=${package.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <div class="mb-3">
                        <label class="form-label">领用科室 *</label>
                        <input type="text" name="department" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">操作员 *</label>
                        <input type="text" name="operator" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">备注</label>
                        <textarea name="notes" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success" th:disabled="${isExpired}">确认发放</button>
                        <a th:href="@{/packages/{id}(id=${package.id})}" class="btn btn-secondary">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
