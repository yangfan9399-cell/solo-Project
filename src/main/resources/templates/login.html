<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>农贸市场摊位管理平台 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); width: 100%; max-width: 400px; }
        .login-box h2 { text-align: center; margin-bottom: 30px; color: #333; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #555; font-weight: 500; }
        .form-group input { width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 14px; transition: border-color 0.3s; }
        .form-group input:focus { outline: none; border-color: #667eea; }
        .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: transform 0.2s; }
        .btn:hover { transform: translateY(-2px); }
        .error { color: #dc3545; text-align: center; margin-bottom: 15px; }
        .roles { margin-top: 20px; padding-top: 20px; border-top: 1px solid #eee; }
        .roles h4 { margin-bottom: 10px; color: #666; }
        .roles ul { list-style: none; color: #888; font-size: 13px; }
        .roles li { margin-bottom: 5px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>农贸市场摊位管理平台</h2>
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn">登录</button>
        </form>
        <div class="roles">
            <h4>测试账户:</h4>
            <ul>
                <li>管理员: admin / admin123</li>
                <li>收费员: cashier / cashier123</li>
                <li>巡查员: inspector / inspector123</li>
                <li>主管: supervisor / supervisor123</li>
            </ul>
        </div>
    </div>
</body>
</html>
