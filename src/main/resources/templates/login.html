<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 银行对公开户尽调平台</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1 class="login-title">对公开户尽调平台</h1>
            <p class="login-subtitle">材料补正与风险复核系统</p>

            <div th:if="${param.error}" class="login-error">
                用户名或密码错误
            </div>

            <div th:if="${param.logout}" style="background: #f0f9eb; color: #67c23a; padding: 10px 14px; border-radius: 4px; margin-bottom: 20px; font-size: 13px; text-align: center;">
                您已安全退出
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input type="text" name="username" class="form-input" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" name="password" class="form-input" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn btn-primary login-btn">登录</button>
            </form>

            <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid #ebeef5;">
                <p style="font-size: 12px; color: #909399; margin-bottom: 8px;">测试账号（密码均为 123456）：</p>
                <div style="font-size: 12px; color: #606266; line-height: 1.8;">
                    <div>客户经理：zhangsan / 李四 lisi</div>
                    <div>运营人员：wangwu</div>
                    <div>风控人员：zhaoliu</div>
                    <div>主管：qianqi</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
