<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宿舍报修系统 - 登录</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-container">
    <div class="login-box">
        <h2>校园宿舍报修系统</h2>
        <form method="post" action="/login">
            <div class="role-section">
                <h3>请选择身份登录（演示用）</h3>
                <label for="studentSelect">学生</label>
                <select id="studentSelect" onchange="setUser(this.value)">
                    <option value="">-- 选择学生 --</option>
                    <option th:each="u : ${students}"
                            th:value="${u.id}"
                            th:text="${u.realName} + ' - ' + ${u.username}"></option>
                </select>

                <label for="dormManagerSelect">宿管</label>
                <select id="dormManagerSelect" onchange="setUser(this.value)">
                    <option value="">-- 选择宿管 --</option>
                    <option th:each="u : ${dormManagers}"
                            th:value="${u.id}"
                            th:text="${u.realName} + ' - ' + ${u.username}"></option>
                </select>

                <label for="repairmanSelect">维修工</label>
                <select id="repairmanSelect" onchange="setUser(this.value)">
                    <option value="">-- 选择维修工 --</option>
                    <option th:each="u : ${repairmen}"
                            th:value="${u.id}"
                            th:text="${u.realName} + ' - ' + ${u.username}"></option>
                </select>

                <label for="supervisorSelect">后勤主管</label>
                <select id="supervisorSelect" onchange="setUser(this.value)">
                    <option value="">-- 选择主管 --</option>
                    <option th:each="u : ${supervisors}"
                            th:value="${u.id}"
                            th:text="${u.realName} + ' - ' + ${u.username}"></option>
                </select>
            </div>

            <input type="hidden" name="userId" id="userId">
            <button type="submit" id="loginBtn" disabled>登录</button>
        </form>
    </div>
</div>

<script>
    function setUser(userId) {
        document.getElementById('userId').value = userId;
        document.getElementById('loginBtn').disabled = !userId;

        if (userId) {
            ['studentSelect', 'dormManagerSelect', 'repairmanSelect', 'supervisorSelect'].forEach(id => {
                const el = document.getElementById(id);
                if (el.value !== userId) {
                    el.value = '';
                }
            });
        }
    }
</script>
</body>
</html>
