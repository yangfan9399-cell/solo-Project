<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>油罐盘点列表 - 加油站油罐计量差异与盘点复核平台</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="header">
        <h1>加油站油罐计量差异与盘点复核平台</h1>
        <div class="nav">
            <a href="/inventory" class="active">盘点管理</a>
            <a href="/summary">复盘统计</a>
        </div>
    </div>

    <div class="container">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="card">
            <h2>盘点记录</h2>

            <form method="get" class="filter-bar">
                <div class="filter-group">
                    <label>站点</label>
                    <select name="stationId">
                        <option value="">全部站点</option>
                        <option th:each="s : ${stations}"
                                th:value="${s.id}"
                                th:text="${s.stationName}"
                                th:selected="${stationId != null and stationId == s.id}"></option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>油品</label>
                    <select name="productId">
                        <option value="">全部油品</option>
                        <option th:each="p : ${products}"
                                th:value="${p.id}"
                                th:text="${p.productName}"
                                th:selected="${productId != null and productId == p.id}"></option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>状态</label>
                    <select name="status">
                        <option value="">全部状态</option>
                        <option th:each="s : ${statuses}"
                                th:value="${s.name()}"
                                th:text="${s.description}"
                                th:selected="${status != null and status == s}"></option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>差异类型</label>
                    <select name="discrepancyType">
                        <option value="">全部类型</option>
                        <option th:each="d : ${discrepancyTypes}"
                                th:value="${d.name()}"
                                th:text="${d.description}"
                                th:selected="${discrepancyType != null and discrepancyType == d}"></option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>开始日期</label>
                    <input type="date" name="startDate" th:value="${startDate}">
                </div>
                <div class="filter-group">
                    <label>结束日期</label>
                    <input type="date" name="endDate" th:value="${endDate}">
                </div>
                <div class="filter-group">
                    <label>&nbsp;</label>
                    <button type="submit" class="btn btn-primary">查询</button>
                </div>
                <div class="filter-group">
                    <label>&nbsp;</label>
                    <a href="/inventory/create" class="btn btn-success">+ 登记盘点</a>
                </div>
            </form>

            <table>
                <thead>
                    <tr>
                        <th>盘点单号</th>
                        <th>站点</th>
                        <th>油罐</th>
                        <th>油品</th>
                        <th>盘点日期</th>
                        <th>液位仪读数(L)</th>
                        <th>理论库存(L)</th>
                        <th>差异量(L)</th>
                        <th>损耗率</th>
                        <th>差异类型</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(records)}">
                        <td colspan="12" style="text-align: center; color: #9ca3af;">暂无数据</td>
                    </tr>
                    <tr th:each="r : ${records}">
                        <td th:text="${r.recordNo}"></td>
                        <td th:text="${r.station.stationName}"></td>
                        <td th:text="${r.tank.tankName}"></td>
                        <td th:text="${r.oilProduct.productName}"></td>
                        <td th:text="${r.inventoryDate}"></td>
                        <td class="text-right" th:text="${#numbers.formatDecimal(r.gaugeVolume, 1, 2)}"></td>
                        <td class="text-right" th:text="${#numbers.formatDecimal(r.theoreticalVolume, 1, 2)}"></td>
                        <td class="text-right">
                            <span th:if="${r.differenceVolume == null}">-</span>
                            <span th:else
                                  th:class="${r.differenceVolume.signum() >= 0 ? 'text-success' : 'text-danger'}"
                                  th:text="${#numbers.formatDecimal(r.differenceVolume, 1, 2)}"></span>
                        </td>
                        <td>
                            <span th:if="${r.lossRate == null}">-</span>
                            <span th:else
                                  th:class="${r.lossRate.compareTo(new java.math.BigDecimal('0.003')) > 0 ? 'text-danger' : 'text-success'}"
                                  th:text="${#numbers.formatPercent(r.lossRate, 1, 2)}"></span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:class="'badge-' + ${r.discrepancyType.name() == 'NORMAL' ? 'success' :
                                                       r.discrepancyType.name() == 'GAUGE_ERROR' ? 'danger' :
                                                       r.discrepancyType.name() == 'DELIVERY_MISMATCH' ? 'warning' : 'info'}"
                                  th:text="${r.discrepancyType.description}"></span>
                        </td>
                        <td>
                            <span class="badge"
                                  th:class="'badge-' + ${r.status.name() == 'ARCHIVED' ? 'secondary' :
                                                       r.status.name() == 'ADJUSTED' ? 'success' :
                                                       r.status.name() == 'INVESTIGATING' ? 'warning' :
                                                       r.status.name() == 'REJECTED' ? 'danger' : 'info'}"
                                  th:text="${r.status.description}"></span>
                        </td>
                        <td>
                            <a th:href="@{'/inventory/' + ${r.id}}" class="btn btn-sm btn-secondary">详情</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
