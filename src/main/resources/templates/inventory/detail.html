<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盘点详情 - 加油站油罐计量差异与盘点复核平台</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="header">
        <h1>加油站油罐计量差异与盘点复核平台</h1>
        <div class="nav">
            <a href="/inventory" class="active">盘点管理</a>
            <a href="/summary">复盘统计</a>
        </div>
    </div>

    <div class="container">
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="card">
            <h2>
                盘点详情
                <span class="badge" style="float: right;"
                      th:class="'badge badge-' + ${record.status.name() == 'ARCHIVED' ? 'secondary' :
                                           record.status.name() == 'ADJUSTED' ? 'success' :
                                           record.status.name() == 'INVESTIGATING' ? 'warning' :
                                           record.status.name() == 'REJECTED' ? 'danger' : 'info'}"
                      th:text="${record.status.description}"></span>
            </h2>

            <div class="section-title">基本信息</div>
            <div class="detail-grid">
                <div class="detail-item">
                    <div class="label">盘点单号</div>
                    <div class="value" th:text="${record.recordNo}"></div>
                </div>
                <div class="detail-item">
                    <div class="label">盘点日期</div>
                    <div class="value" th:text="${record.inventoryDate}"></div>
                </div>
                <div class="detail-item">
                    <div class="label">站点</div>
                    <div class="value" th:text="${record.station.stationName}"></div>
                </div>
                <div class="detail-item">
                    <div class="label">油罐</div>
                    <div class="value" th:text="${record.tank.tankCode + ' - ' + record.tank.tankName}"></div>
                </div>
                <div class="detail-item">
                    <div class="label">油品</div>
                    <div class="value" th:text="${record.oilProduct.productName}"></div>
                </div>
                <div class="detail-item">
                    <div class="label">油罐容量</div>
                    <div class="value" th:text="${#numbers.formatDecimal(record.tank.capacity, 1, 2)} + ' L'"></div>
                </div>
            </div>

            <div th:if="${record.discrepancyType.name() == 'GAUGE_ERROR'}" class="alert alert-warning mt-2">
                <strong>⚠️ 液位仪异常</strong> - 当前液位仪状态异常，数据仅供参考，禁止直接调整库存
            </div>

            <div class="section-title">液位与库存数据</div>
            <div class="detail-grid">
                <div class="detail-item">
                    <div class="label">液位仪状态</div>
                    <div class="value">
                        <span class="badge" th:class="${record.gaugeNormal} ? 'badge-success' : 'badge-danger'"
                              th:text="${record.gaugeNormal} ? '正常' : '异常'"></span>
                    </div>
                </div>
                <div class="detail-item">
                    <div class="label">液位仪读数</div>
                    <div class="value" th:text="${#numbers.formatDecimal(record.gaugeVolume, 1, 2)} + ' L'"></div>
                </div>
                <div class="detail-item">
                    <div class="label">期初库存</div>
                    <div class="value" th:text="${#numbers.formatDecimal(record.openingVolume, 1, 2)} + ' L'"></div>
                </div>
                <div class="detail-item">
                    <div class="label">本期配送量</div>
                    <div class="value" th:text="${#numbers.formatDecimal(record.deliveryVolume, 1, 2)} + ' L'"></div>
                </div>
                <div class="detail-item">
                    <div class="label">本期销售量</div>
                    <div class="value" th:text="${#numbers.formatDecimal(record.salesVolume, 1, 2)} + ' L'"></div>
                </div>
                <div class="detail-item">
                    <div class="label">理论期末库存</div>
                    <div class="value" th:text="${#numbers.formatDecimal(record.theoreticalVolume, 1, 2)} + ' L'"></div>
                </div>
                <div class="detail-item">
                    <div class="label">水位</div>
                    <div class="value" th:text="${record.waterLevel} + ' mm'"></div>
                </div>
                <div class="detail-item">
                    <div class="label">温度</div>
                    <div class="value" th:text="${record.temperature} + ' ℃'"></div>
                </div>
            </div>

            <div class="section-title">差异计算</div>
            <div class="detail-grid">
                <div class="detail-item">
                    <div class="label">差异量</div>
                    <div class="value"></div>
                        <span th:if="${record.differenceVolume == null}">-</span>
                        <span th:else
                              th:class="${record.differenceVolume.signum() >= 0 ? 'text-success' : 'text-danger'}"
                              th:text="${#numbers.formatDecimal(record.differenceVolume, 1, 2)} + ' L'"></span>
                    </div>
                </div>
                <div class="detail-item">
                    <div class="label">损耗率</div>
                    <div class="value">
                        <span th:if="${record.lossRate == null}">-</span>
                        <span th:else
                              th:class="${record.lossRate.compareTo(new java.math.BigDecimal('0.003')) > 0 ? 'text-danger' : 'text-success'}"
                              th:text="${#numbers.formatPercent(record.lossRate, 1, 2)}"></span>
                    </div>
                </div>
                <div class="detail-item">
                    <div class="label">差异类型</div>
                    <div class="value">
                        <span class="badge"
                              th:class="'badge-' + ${record.discrepancyType.name() == 'NORMAL' ? 'success' :
                                                   record.discrepancyType.name() == 'GAUGE_ERROR' ? 'danger' :
                                                   record.discrepancyType.name() == 'DELIVERY_MISMATCH' ? 'warning' : 'info'}"
                              th:text="${record.discrepancyType.description}"></span>
                    </div>
                </div>
                <div class="detail-item" th:if="${record.adjustedVolume != null}">
                    <div class="label">调整量</div>
                    <div class="value" th:text="${#numbers.formatDecimal(record.adjustedVolume, 1, 2)} + ' L'"></div>
                </div>
            </div>

            <div class="section-title">相关配送单</div>
            <table>
                <thead>
                    <tr>
                        <th>配送单号</th>
                        <th>配送日期</th>
                        <th>配送量(L)</th>
                        <th>实收量(L)</th>
                        <th>运输公司</th>
                        <th>备注</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(deliveries)}">
                        <td colspan="6" style="text-align: center; color: #9ca3af;">暂无配送单</td>
                    </tr>
                    <tr th:each="d : ${deliveries}">
                        <td th:text="${d.deliveryNo}"></td>
                        <td th:text="${d.deliveryDate}"></td>
                        <td class="text-right" th:text="${#numbers.formatDecimal(d.deliveryVolume, 1, 2)}"></td>
                        <td class="text-right" th:text="${#numbers.formatDecimal(d.actualVolume, 1, 2)}"></td>
                        <td th:text="${d.carrier}"></td>
                        <td th:text="${d.remark}"></td>
                    </tr>
                </tbody>
            </table>

            <div class="section-title">处理备注</div>
            <div class="detail-grid">
                <div class="detail-item">
                    <div class="label">站长</div>
                    <div class="value" th:text="${record.stationManager}"></div>
                    <div class="text-muted" style="font-size: 0.8rem;" th:text="${record.stationRemark}"></div>
                </div>
                <div class="detail-item">
                    <div class="label">计量员</div>
                    <div class="value" th:text="${record.gauger ?: '未复核'}"></div>
                    <div class="text-muted" style="font-size: 0.8rem;" th:text="${record.gaugerRemark}"></div>
                </div>
                <div class="detail-item">
                    <div class="label">区域主管</div>
                    <div class="value" th:text="${record.supervisor ?: '未处置'}"></div>
                    <div class="text-muted" style="font-size: 0.8rem;" th:text="${record.supervisorRemark}"></div>
                </div>
            </div>

            <div class="section-title">历史节点</div>
            <div class="timeline">
                <div class="timeline-item" th:each="h : ${history}">
                    <div class="time" th:text="${#temporals.format(h.actionTime, 'yyyy-MM-dd HH:mm:ss')}"></div>
                    <div class="operator">
                        <span th:text="${h.operator}"></span>
                        <span class="badge badge-secondary" th:text="${h.operatorRole.description}"></span>
                        <span class="badge"
                              th:class="'badge-' + ${h.actionType.name() == 'ARCHIVED' ? 'secondary' :
                                                   h.actionType.name() == 'ADJUSTED' ? 'success' :
                                                   h.actionType.name() == 'INVESTIGATING' ? 'warning' :
                                                   h.actionType.name() == 'REJECTED' ? 'danger' : 'info'}"
                              th:text="${h.actionType.description}"></span>
                    </div>
                    <div class="remark" th:text="${h.remark}"></div>
                </div>
            </div>

            <div style="margin-top: 2rem; display: flex; gap: 0.75rem; flex-wrap: wrap;">
                <a href="/inventory" class="btn btn-secondary">返回列表</a>

                <div th:if="${canReview}">
                    <button class="btn btn-success" onclick="showReviewModal(true)">复核通过</button>
                    <button class="btn btn-danger" onclick="showReviewModal(false)">驳回</button>
                </div>

                <div th:if="${canDispose}">
                    <button th:if="${canAdjust}" class="btn btn-primary" onclick="showAdjustModal()">调整库存</button>
                    <button th:unless="${canAdjust}" class="btn btn-primary" disabled title="液位仪异常时禁止调整库存">调整库存</button>
                    <button class="btn btn-warning" onclick="showInvestigateModal()">启动追查</button>
                    <button class="btn btn-secondary" onclick="showArchiveModal()">归档</button>
                </div>

                <div th:if="${record.status.name() == 'INVESTIGATING' or record.status.name() == 'ADJUSTED'}">
                    <button class="btn btn-secondary" onclick="showArchiveModal()">归档</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 复核弹窗 -->
    <div class="modal-overlay" id="reviewModal">
        <div class="modal">
            <h3 id="reviewTitle">复核确认</h3>
            <form method="post" th:action="@{'/inventory/' + ${record.id} + '/review'}" id="reviewForm">
                <input type="hidden" name="pass" id="reviewPass">
                <div class="form-group">
                    <label>复核备注</label>
                    <textarea name="remark" rows="4" placeholder="请输入复核意见..." required></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('reviewModal')">取消</button>
                    <button type="submit" class="btn btn-primary">确认</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 调整库存弹窗 -->
    <div class="modal-overlay" id="adjustModal">
        <div class="modal">
            <h3>调整库存</h3>
            <form method="post" th:action="@{'/inventory/' + ${record.id} + '/adjust'}" id="adjustForm">
                <div class="form-group">
                    <label>调整量 (L)</label>
                    <input type="number" step="0.01" name="adjustedVolume"
                           th:value="${record.differenceVolume}"
                           placeholder="请输入调整量" required>
                    <small class="text-muted">正为调增，负为调减</small>
                </div>
                <div class="form-group">
                    <label>调整说明</label>
                    <textarea name="remark" rows="4" placeholder="请输入调整原因和说明..." required></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('adjustModal')">取消</button>
                    <button type="submit" class="btn btn-primary">确认调整</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 追查弹窗 -->
    <div class="modal-overlay" id="investigateModal">
        <div class="modal">
            <h3>启动追查</h3>
            <form method="post" th:action="@{'/inventory/' + ${record.id} + '/investigate'}" id="investigateForm">
                <div class="form-group">
                    <label>追查说明</label>
                    <textarea name="remark" rows="4" placeholder="请输入追查原因和方向..." required></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('investigateModal')">取消</button>
                    <button type="submit" class="btn btn-warning">确认追查</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 归档弹窗 -->
    <div class="modal-overlay" id="archiveModal">
        <div class="modal">
            <h3>归档确认</h3>
            <form method="post" th:action="@{'/inventory/' + ${record.id} + '/archive'}" id="archiveForm">
                <div class="form-group">
                    <label>归档备注</label>
                    <textarea name="remark" rows="4" placeholder="请输入归档说明..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('archiveModal')">取消</button>
                    <button type="submit" class="btn btn-primary">确认归档</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function showReviewModal(pass) {
            document.getElementById('reviewPass').value = pass;
            document.getElementById('reviewTitle').textContent = pass ? '复核通过' : '驳回盘点';
            document.getElementById('reviewModal').classList.add('active');
        }

        function showAdjustModal() {
            document.getElementById('adjustModal').classList.add('active');
        }

        function showInvestigateModal() {
            document.getElementById('investigateModal').classList.add('active');
        }

        function showArchiveModal() {
            document.getElementById('archiveModal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        document.querySelectorAll('.modal-overlay').forEach(function(overlay) {
            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) {
                    overlay.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
