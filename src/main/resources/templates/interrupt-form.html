
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>报告中断</title>
</head>
<body>
    <div th:fragment="content">
        <a th:href="@{/screenings/{id}(id=${screening.id})}" class="btn btn-secondary">返回详情</a>
        
        <div class="card">
            <h3>报告放映中断 - [[${screening.movie.title}]] - [[${screening.hall.name}]]</h3>
            <form th:action="@{/screenings/interrupt/{id}(id=${screening.id})}" method="post">
                <div class="form-group">
                    <label>报告人姓名</label>
                    <input type="text" name="reporterName" required placeholder="请输入报告人姓名">
                </div>
                
                <div class="form-group">
                    <label>故障类型</label>
                    <select name="faultType" required>
                        <option th:each="faultType : ${faultTypes}" 
                                th:value="${faultType}" 
                                th:text="${faultType.getDescription()}">
                        </option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>故障描述</label>
                    <textarea name="faultDescription" required placeholder="请详细描述故障情况"></textarea>
                </div>
                
                <button type="submit" class="btn btn-danger">确认报告中断</button>
            </form>
        </div>
    </div>
</body>
</html>
