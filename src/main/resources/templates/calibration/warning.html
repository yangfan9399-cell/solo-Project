<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校准即将到期 - 工装夹具管控系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: _}"></div>

<div class="container">
    <div class="page-header">
        <a href="/calibration" style="color: #666; text-decoration: none;">← 返回校准管理</a>
        <h1 class="page-title" style="margin-top: 0.5rem;">校准即将到期</h1>
        <p class="page-subtitle">7天内即将到期的夹具清单</p>
    </div>

    <div class="warning-banner">
        <div class="expired-banner-text">
            <span style="font-size: 1.5rem;">⏰</span>
            <div>
                <strong>提醒：以下夹具校准即将到期，请提前安排送检</strong><br>
                <span style="font-size: 0.85rem;">避免校准过期影响生产使用</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <table class="table">
                <thead>
                <tr>
                    <th>夹具编号</th>
                    <th>夹具名称</th>
                    <th>类型</th>
                    <th>适用工序</th>
                    <th>下次校准日期</th>
                    <th>剩余天数</th>
                    <th>责任人</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="fixture : ${warningFixtures}">
                    <td><a th:href="@{'/fixtures/' + ${fixture.id}}" th:text="${fixture.fixtureNo}"></a></td>
                    <td th:text="${fixture.fixtureName}"></td>
                    <td th:text="${fixture.fixtureType}"></td>
                    <td th:text="${fixture.applicableProcess}"></td>
                    <td class="text-warning" th:text="${fixture.nextCalibrationDate != null ? #temporals.format(fixture.nextCalibrationDate, 'yyyy-MM-dd') : '-'}"></td>
                    <td>
                        <span th:text="${fixture.daysUntilCalibration + ' 天'}"></span>
                    </td>
                    <td th:text="${fixture.responsiblePerson ?: '-'}"></td>
                    <td>
                        <div class="btn-group">
                            <a th:href="@{'/fixtures/' + ${fixture.id}}" class="btn btn-secondary btn-sm">详情</a>
                            <form method="post" th:action="@{'/fixtures/' + ${fixture.id} + '/send-calibration'}"
                                  onsubmit="return confirm('确认安排送检此夹具？');">
                                <button type="submit" class="btn btn-warning btn-sm">安排送检</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(warningFixtures)}">
                    <td colspan="8" class="empty-state">
                        <div class="empty-state-icon">✅</div>
                        <div class="empty-state-text">7天内无即将到期的校准</div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: _}"></div>
</body>
</html>
