<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>添加校准记录 - 工装夹具管控系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: _}"></div>

<div class="container">
    <div class="page-header">
        <a href="/calibration" style="color: #666; text-decoration: none;">← 返回列表</a>
        <h1 class="page-title" style="margin-top: 0.5rem;">添加校准记录</h1>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card">
        <div class="card-body">
            <form method="post" action="/calibration/add">
                <h3 class="section-title">选择夹具</h3>
                <div class="form-group">
                    <label class="form-label">夹具 *</label>
                    <select name="fixtureId" class="form-control" required>
                        <option value="">请选择夹具</option>
                        <option th:each="fixture : ${fixtures}"
                                th:value="${fixture.id}"
                                th:text="${fixture.fixtureNo + ' - ' + fixture.fixtureName + ' (' + fixture.fixtureType + ')'}"
                                th:selected="${fixture.id == selectedFixtureId}"></option>
                    </select>
                </div>

                <h3 class="section-title" style="margin-top: 1.5rem;">校准信息</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">校准日期 *</label>
                        <input type="date" name="calibrationDate" class="form-control" required
                               th:value="${#dates.format(today, 'yyyy-MM-dd')}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">校准机构</label>
                        <input type="text" name="calibrationAgency" class="form-control" placeholder="如：国家计量院">
                    </div>
                    <div class="form-group">
                        <label class="form-label">证书编号</label>
                        <input type="text" name="certificateNo" class="form-control" placeholder="校准证书编号">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">校准结果 *</label>
                        <select name="result" class="form-control" required>
                            <option th:each="r : ${results}"
                                    th:value="${r.name()}"
                                    th:text="${r.description}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">下次校准日期 *</label>
                        <input type="date" name="nextCalibrationDate" class="form-control" required
                               th:value="${#dates.format(nextYear, 'yyyy-MM-dd')}">
                    </div>
                    <div class="form-group">
                        <label class="form-label">校准人</label>
                        <input type="text" name="calibrator" class="form-control">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">备注</label>
                    <textarea name="remark" class="form-control" rows="3"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">保存记录</button>
                    <a href="/calibration" class="btn btn-secondary">取消</a>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: _}"></div>
</body>
</html>
