
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新增补偿</title>
</head>
<body>
    <div th:fragment="content">
        <a th:href="@{/compensations}" class="btn btn-secondary">返回列表</a>
        
        <div class="card">
            <h3>新增观众补偿</h3>
            <form th:action="@{/compensations/create}" method="post">
                <div class="form-group">
                    <label>关联中断记录</label>
                    <select name="interruptId" required>
                        <option value="">请选择中断记录</option>
                        <option th:each="interrupt : ${interrupts}" 
                                th:value="${interrupt.id}" 
                                th:text="${interrupt.screening.movie.title} - ${interrupt.screening.hall.name} - ${interrupt.interruptTime}">
                        </option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>受影响观众人数</label>
                    <input type="number" name="affectedAudienceCount" required min="1">
                </div>
                
                <div class="form-group">
                    <label>补偿金额(元)</label>
                    <input type="number" name="compensationAmount" required min="0" step="0.01">
                </div>
                
                <div class="form-group">
                    <label>补偿类型</label>
                    <select name="compensationType" required>
                        <option value="退票">退票</option>
                        <option value="赠券">赠券</option>
                        <option value="退票+赠券">退票+赠券</option>
                        <option value="现金补偿">现金补偿</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>提交人姓名</label>
                    <input type="text" name="submitterName" required placeholder="请输入提交人姓名">
                </div>
                
                <button type="submit" class="btn btn-success">提交补偿申请</button>
            </form>
        </div>
    </div>
</body>
</html>
