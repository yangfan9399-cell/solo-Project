<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('提交整改')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}">首页</a></li>
            <li class="breadcrumb-item"><a th:href="@{/hazards}">隐患列表</a></li>
            <li class="breadcrumb-item"><a th:href="@{/hazards/{id}(id=${hazard.id})}" th:text="'#' + ${hazard.id}">隐患详情</a></li>
            <li class="breadcrumb-item active">提交整改</li>
        </ol>
    </nav>

    <h2 class="mb-4">🔧 提交整改</h2>

    <div class="row">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0" th:text="${hazard.title}">隐患标题</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/hazards/{id}/rectify(id=${hazard.id})}" method="post">
                        <div class="mb-3">
                            <label class="form-label">整改情况说明 <span class="text-danger">*</span></label>
                            <textarea name="description" class="form-control" rows="6" required
                                      placeholder="请详细描述整改措施和完成情况..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">整改照片（占位）</label>
                            <input type="text" name="photoUrl" class="form-control"
                                   placeholder="照片URL（可留空作为占位）">
                            <div class="form-text">当前为占位功能，实际项目中可替换为文件上传</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">整改人 <span class="text-danger">*</span></label>
                            <select name="rectifierId" class="form-select" required>
                                <option value="">请选择整改人</option>
                                <option th:each="user : ${rectifiers}"
                                        th:value="${user.id}"
                                        th:text="${user.realName + ' - ' + user.department}">
                                </option>
                            </select>
                        </div>

                        <div class="alert alert-info">
                            <strong>提示：</strong> 提交后将进入验收环节，由安全主管审核确认。
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a th:href="@{/hazards/{id}(id=${hazard.id})}" class="btn btn-outline-secondary">取消</a>
                            <button type="submit" class="btn btn-primary">提交整改</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">📌 整改要求</h5>
                </div>
                <div class="card-body small">
                    <p><strong>责任部门：</strong> <span th:text="${hazard.responsibleDepartment}"></span></p>
                    <p><strong>责任人：</strong>
                        <span th:if="${hazard.responsibleDepartmentHead != null}"
                              th:text="${hazard.responsibleDepartmentHead.realName}"></span>
                    </p>
                    <p><strong>截止时间：</strong>
                        <span th:if="${hazard.deadline != null}"
                              th:text="${#temporals.format(hazard.deadline, 'yyyy-MM-dd HH:mm')}"></span>
                    </p>
                    <hr>
                    <p><strong>注意事项：</strong></p>
                    <ul>
                        <li>整改需彻底消除安全隐患</li>
                        <li>需提供整改前后对比照片</li>
                        <li>如有困难请及时上报</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
