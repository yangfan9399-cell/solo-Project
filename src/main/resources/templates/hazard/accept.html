<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('验收销项')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}">首页</a></li>
            <li class="breadcrumb-item"><a th:href="@{/hazards}">隐患列表</a></li>
            <li class="breadcrumb-item"><a th:href="@{/hazards/{id}(id=${hazard.id})}" th:text="'#' + ${hazard.id}">隐患详情</a></li>
            <li class="breadcrumb-item active">验收销项</li>
        </ol>
    </nav>

    <h2 class="mb-4">✅ 验收销项</h2>

    <div class="row">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0" th:text="${hazard.title}">隐患标题</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/hazards/{id}/accept(id=${hazard.id})}" method="post">
                        <div class="mb-3">
                            <label class="form-label">验收人 <span class="text-danger">*</span></label>
                            <select name="directorId" class="form-select" required>
                                <option value="">请选择安全主管</option>
                                <option th:each="user : ${directors}"
                                        th:value="${user.id}"
                                        th:text="${user.realName + ' - ' + user.department}">
                                </option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">验收意见</label>
                            <textarea name="remark" class="form-control" rows="4"
                                      placeholder="请输入验收意见（可选）..."></textarea>
                        </div>

                        <div class="alert alert-success">
                            <strong>确认：</strong> 验收通过后，该隐患将正式销项。
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a th:href="@{/hazards/{id}(id=${hazard.id})}" class="btn btn-outline-secondary">返回</a>
                            <button type="button" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#rejectModal">
                                验收退回
                            </button>
                            <button type="submit" class="btn btn-success">确认通过</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">📌 整改信息</h5>
                </div>
                <div class="card-body small">
                    <p><strong>等级：</strong>
                        <span class="status-badge"
                              th:classappend="'level-' + ${hazard.level.name().toLowerCase()}"
                              th:text="${hazard.level.displayName}">
                        </span>
                    </p>
                    <p><strong>责任部门：</strong> <span th:text="${hazard.responsibleDepartment}"></span></p>
                    <p><strong>提交时间：</strong>
                        <span th:if="${hazard.rectifiedAt != null}"
                              th:text="${#temporals.format(hazard.rectifiedAt, 'yyyy-MM-dd HH:mm')}"></span>
                    </p>
                    <hr>
                    <p><strong>验收标准：</strong></p>
                    <ul>
                        <li>隐患是否彻底消除</li>
                        <li>整改措施是否到位</li>
                        <li>是否符合安全规范</li>
                        <li>相关记录是否完整</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="rejectModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/hazards/{id}/reject(id=${hazard.id})}" method="post">
                <div class="modal-header">
                    <h5 class="modal-title">验收退回</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">安全主管 <span class="text-danger">*</span></label>
                        <select name="directorId" class="form-select" required>
                            <option value="">请选择安全主管</option>
                            <option th:each="user : ${directors}"
                                    th:value="${user.id}"
                                    th:text="${user.realName + ' - ' + user.department}">
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">退回原因 <span class="text-danger">*</span></label>
                        <textarea name="rejectReason" class="form-control" rows="3" required placeholder="请输入退回原因..."></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-danger">确认退回</button>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
