<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('隐患列表')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container mt-4">
    <div class="alert alert-success alert-dismissible fade show" th:if="${message}" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row mb-4">
        <div class="col-md-8">
            <h2>📋 隐患列表</h2>
        </div>
        <div class="col-md-4 text-end">
            <a th:href="@{/hazards/register}" class="btn btn-primary">➕ 登记隐患</a>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-12">
            <form method="get" th:action="@{/hazards}" class="row g-3">
                <div class="col-md-3">
                    <select name="status" class="form-select" onchange="this.form.submit()">
                        <option value="">全部状态</option>
                        <option th:each="s : ${statuses}"
                                th:value="${s.name()}"
                                th:text="${s.displayName}"
                                th:selected="${currentStatus != null and currentStatus.name() == s.name()}">
                        </option>
                    </select>
                </div>
                <div class="col-md-6">
                    <input type="text" name="keyword" class="form-control" placeholder="搜索标题、位置、楼栋..."
                           th:value="${keyword}">
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-outline-primary">🔍 搜索</button>
                    <a th:href="@{/hazards}" class="btn btn-outline-secondary">重置</a>
                </div>
            </form>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card stat-card total">
                <div class="card-body">
                    <h6 class="card-title text-muted">总数</h6>
                    <h4 class="card-text" th:text="${totalCount}">0</h4>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card pending">
                <div class="card-body">
                    <h6 class="card-title text-muted">待处理</h6>
                    <h4 class="card-text text-warning" th:text="${pendingCount}">0</h4>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card accepted">
                <div class="card-body">
                    <h6 class="card-title text-muted">已销项</h6>
                    <h4 class="card-text text-success" th:text="${acceptedCount}">0</h4>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card stat-card overdue">
                <div class="card-body">
                    <h6 class="card-title text-muted">超期</h6>
                    <h4 class="card-text text-danger" th:text="${overdueCount}">0</h4>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>隐患标题</th>
                    <th>等级</th>
                    <th>类别</th>
                    <th>位置</th>
                    <th>状态</th>
                    <th>责任部门</th>
                    <th>截止时间</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="hazard : ${hazards}">
                    <td th:text="${hazard.id}">1</td>
                    <td>
                        <a th:href="@{/hazards/{id}(id=${hazard.id})}" th:text="${hazard.title}">隐患标题</a>
                    </td>
                    <td>
                        <span class="status-badge"
                              th:classappend="'level-' + ${hazard.level.name().toLowerCase()}"
                              th:text="${hazard.level.displayName}">
                            等级
                        </span>
                    </td>
                    <td th:text="${hazard.category.displayName}">类别</td>
                    <td th:text="${hazard.building + ' ' + (hazard.floor != null ? hazard.floor : '') + ' ' + (hazard.location != null ? hazard.location : '')}">位置</td>
                    <td>
                        <span class="badge"
                              th:classappend="${hazard.status.name() == 'ACCEPTED' ? 'bg-success' :
                                              (hazard.status.name() == 'OVERDUE' ? 'bg-danger' :
                                              (hazard.status.name() == 'RECTIFIED' ? 'bg-info' :
                                              (hazard.status.name() == 'REJECTED' ? 'bg-warning text-dark' :
                                              (hazard.status.name() == 'RECTIFYING' ? 'bg-primary' : 'bg-secondary'))))}"
                              th:text="${hazard.status.displayName}">
                            状态
                        </span>
                        <span th:if="${hazard.escalated}" class="badge bg-danger ms-1">已升级</span>
                    </td>
                    <td th:text="${hazard.responsibleDepartment != null ? hazard.responsibleDepartment : '未分配'}">责任部门</td>
                    <td>
                        <span th:if="${hazard.deadline != null}"
                              th:classappend="${hazard.overdue or hazard.status.name() == 'OVERDUE' ? 'overdue-text' : ''}"
                              th:text="${#temporals.format(hazard.deadline, 'yyyy-MM-dd')}">
                            截止时间
                        </span>
                        <span th:if="${hazard.deadline == null}" class="text-muted">-</span>
                    </td>
                    <td>
                        <a th:href="@{/hazards/{id}(id=${hazard.id})}" class="btn btn-sm btn-outline-primary">详情</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(hazards)}">
                    <td colspan="9" class="text-center text-muted py-4">暂无数据</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
