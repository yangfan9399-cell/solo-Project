<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout.html :: body}">
<head>
    <title>赔付审核</title>
</head>
<body>
    <div th:fragment="content">
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <a th:href="@{/compensation/pending}" class="btn btn-primary" th:class="${activeTab == 'pending' ? 'active' : ''}">待评估</a>
            <a th:href="@{/compensation/review}" class="btn btn-secondary" th:class="${activeTab == 'review' ? 'active' : ''}">待复核</a>
        </div>

        <div class="card">
            <h3>待评估赔付申请</h3>
            <table>
                <thead>
                    <tr>
                        <th>运单号</th>
                        <th>货损描述</th>
                        <th>损失比例</th>
                        <th>索赔金额</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="compensation : ${compensations}">
                        <td><a th:href="@{/waybills/{id}(id=${compensation.waybillId})}" th:text="'WB' + ${compensation.waybillId}"></a></td>
                        <td th:text="${compensation.damageDescription}"></td>
                        <td th:text="${compensation.damagePercentage + '%'}"></td>
                        <td th:text="'¥' + ${compensation.claimedAmount}"></td>
                        <td>
                            <button class="btn btn-primary" style="padding:4px 10px;font-size:12px;" 
                                    onclick="document.getElementById('assess-form-' + ${compensation.id}).style.display='block'">评估</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div th:each="compensation : ${compensations}">
            <div class="card" id="assess-form-${compensation.id}" style="display: none;">
                <h4>评估赔付 - 运单ID: ${compensation.waybillId}</h4>
                <form th:action="@{/compensation/{id}/assess(id=${compensation.id})}" method="post">
                    <div class="form-group">
                        <label>评估金额 (元)</label>
                        <input type="number" name="assessedAmount" min="0" step="0.01" th:value="${compensation.claimedAmount}"/>
                    </div>
                    <div class="form-group">
                        <label>评估意见</label>
                        <textarea name="comment" rows="2" placeholder="请输入评估意见..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">提交评估</button>
                    <button type="button" class="btn btn-secondary" onclick="document.getElementById('assess-form-${compensation.id}').style.display='none'">取消</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
