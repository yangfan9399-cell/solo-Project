<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>借用申请 - 工装夹具管控系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: _}"></div>

<div class="container">
    <div class="page-header">
        <a href="/borrows" style="color: #666; text-decoration: none;">← 返回列表</a>
        <h1 class="page-title" style="margin-top: 0.5rem;">借用申请</h1>
        <p class="page-subtitle">产线经办人申请借用夹具</p>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card">
        <div class="card-body">
            <form method="post" action="/borrows/apply">
                <h3 class="section-title">选择夹具</h3>
                <div class="form-group">
                    <label class="form-label">选择夹具 *</label>
                    <select name="fixtureId" class="form-control" required>
                        <option value="">请选择可用夹具</option>
                        <option th:each="fixture : ${availableFixtures}"
                                th:value="${fixture.id}"
                                th:text="${fixture.fixtureNo + ' - ' + fixture.fixtureName + ' (' + fixture.fixtureType + ')'}"
                                th:selected="${fixture.id == selectedFixtureId}"></option>
                    </select>
                    <p class="text-muted" style="font-size: 0.8rem; margin-top: 0.25rem;">仅显示可用状态且校准有效的夹具</p>
                </div>

                <h3 class="section-title" style="margin-top: 1.5rem;">申请信息</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">申请人（产线经办人） *</label>
                        <input type="text" name="applicant" class="form-control" required placeholder="请输入姓名">
                    </div>
                    <div class="form-group">
                        <label class="form-label">产线 *</label>
                        <select name="productionLine" class="form-control" required>
                            <option value="">请选择产线</option>
                            <option value="A1线">A1线</option>
                            <option value="A2线">A2线</option>
                            <option value="B1线">B1线</option>
                            <option value="B2线">B2线</option>
                            <option value="C1线">C1线</option>
                            <option value="总装线">总装线</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">预计归还日期 *</label>
                        <input type="date" name="expectedReturnDate" class="form-control" required
                               th:value="${#dates.format(defaultReturnDate, 'yyyy-MM-dd')}">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">借用目的</label>
                    <textarea name="purpose" class="form-control" rows="3" placeholder="请简要说明借用目的"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">提交申请</button>
                    <a href="/borrows" class="btn btn-secondary">取消</a>
                </div>
            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: _}"></div>
</body>
</html>
