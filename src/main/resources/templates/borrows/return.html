<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>归还夹具 - 工装夹具管控系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: _}"></div>

<div class="container">
    <div class="page-header">
        <a th:href="@{'/borrows/' + ${borrow.id}}" style="color: #666; text-decoration: none;">← 返回详情</a>
        <h1 class="page-title" style="margin-top: 0.5rem;">归还夹具</h1>
        <p class="page-subtitle">夹具编号：<span th:text="${borrow.fixture.fixtureNo}"></span></p>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="detail-grid" style="margin-bottom: 1.5rem;">
                <div class="detail-item">
                    <span class="detail-label">夹具名称</span>
                    <span class="detail-value" th:text="${borrow.fixture.fixtureName}"></span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">申请人</span>
                    <span class="detail-value" th:text="${borrow.applicant}"></span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">产线</span>
                    <span class="detail-value" th:text="${borrow.productionLine}"></span>
                </div>
                <div class="detail-item">
                    <span class="detail-label">借用日期</span>
                    <span class="detail-value" th:text="${borrow.borrowDate != null ? #dates.format(borrow.borrowDate, 'yyyy-MM-dd') : '-'}"></span>
                </div>
            </div>

            <form method="post" th:action="@{'/borrows/' + ${borrow.id} + '/return'}">
                <h3 class="section-title">归还检查</h3>

                <div class="form-group">
                    <label class="form-label">
                        <input type="checkbox" name="damaged" id="damaged" onchange="toggleDamageDesc()">
                        夹具是否损坏？
                    </label>
                </div>

                <div class="form-group" id="damageDescGroup" style="display: none;">
                    <label class="form-label">损坏说明 *</label>
                    <textarea name="damageDescription" class="form-control" rows="4"
                              placeholder="请详细描述损坏情况，包括损坏部位、程度等"
                              id="damageDescription"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary"
                            onclick="return confirm('确认归还此夹具？');">
                        提交归还
                    </button>
                    <a th:href="@{'/borrows/' + ${borrow.id}}" class="btn btn-secondary">取消</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function toggleDamageDesc() {
    var checkbox = document.getElementById('damaged');
    var descGroup = document.getElementById('damageDescGroup');
    var descInput = document.getElementById('damageDescription');

    if (checkbox.checked) {
        descGroup.style.display = 'block';
        descInput.required = true;
    } else {
        descGroup.style.display = 'none';
        descInput.required = false;
    }
}
</script>

<div th:replace="~{fragments/footer :: _}"></div>
</body>
</html>
