<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>核赔处理 - 保险理赔系统</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">保险理赔材料补正与核赔复核系统</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">首页</a></li>
                <li class="nav-item"><a class="nav-link" href="/cases">案件管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/cases/register">案件登记</a></li>
                <li class="nav-item"><a class="nav-link" href="/statistics">复盘统计</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>

    <h2 class="mb-4">
        核赔处理
        <small class="text-muted fs-6" th:text="'案件号：' + ${claimCase.caseNo}"></small>
    </h2>

    <div th:if="${claimCase.frozen}" class="alert alert-danger mb-4">
        ⚠️ 案件已冻结，无法进行核赔操作。请先解除冻结。
        <a th:href="@{/cases/{id}(id=${claimCase.id})}" class="btn btn-sm btn-danger ms-2">返回详情</a>
    </div>

    <div class="row">
        <div class="col-md-8">
            <div class="card mb-4">
                <div class="card-header">保单信息摘要</div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4">
                            <div class="info-label">保单号</div>
                            <div class="info-value" th:text="${policy.policyNo}"></div>
                        </div>
                        <div class="col-md-4">
                            <div class="info-label">险种</div>
                            <div class="info-value" th:text="${policy.insuranceType}"></div>
                        </div>
                        <div class="col-md-4">
                            <div class="info-label">保险金额</div>
                            <div class="info-value" th:text="'¥' + ${#numbers.formatDecimal(policy.sumInsured, 1, 'COMMA', 2, 'DEFAULT')}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header">出险信息摘要</div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4">
                            <div class="info-label">出险日期</div>
                            <div class="info-value" th:text="${claimCase.accidentDate}"></div>
                        </div>
                        <div class="col-md-4">
                            <div class="info-label">事故类型</div>
                            <div class="info-value" th:text="${claimCase.accidentType}"></div>
                        </div>
                        <div class="col-md-4">
                            <div class="info-label">索赔金额</div>
                            <div class="info-value text-primary" th:text="'¥' + ${#numbers.formatDecimal(claimCase.claimAmount, 1, 'COMMA', 2, 'DEFAULT')}"></div>
                        </div>
                        <div class="col-12 mt-3">
                            <div class="info-label">事故经过</div>
                            <div class="info-value" th:text="${claimCase.accidentDescription}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card mb-4">
                <div class="card-header">材料清单</div>
                <div class="card-body">
                    <table class="table table-sm">
                        <thead>
                        <tr>
                            <th>材料名称</th>
                            <th>状态</th>
                            <th>上传时间</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="material : ${materials}">
                            <td th:text="${material.materialName}"></td>
                            <td>
                                <span class="badge" th:class="${material.status == 'SUBMITTED'} ? 'bg-info' :
                                                              (${material.status == 'APPROVED'} ? 'bg-success' :
                                                              (${material.status == 'MISSING'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                      th:text="${material.status == 'SUBMITTED'} ? '已提交' :
                                               (${material.status == 'APPROVED'} ? '通过' :
                                               (${material.status == 'MISSING'} ? '缺失' : material.status))}">
                                </span>
                            </td>
                            <td th:text="${#temporals.format(material.uploadTime, 'MM-dd HH:mm')}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div th:if="${!#lists.isEmpty(relatedCases)}" class="card mb-4 border-warning">
                <div class="card-header bg-warning bg-opacity-10">
                    ⚠️ 关联案件（重复报案）
                </div>
                <div class="card-body">
                    <p class="text-muted small mb-2">请核实是否为重复报案后再进行核赔决定。</p>
                    <table class="table table-sm mb-0">
                        <thead>
                        <tr>
                            <th>案件号</th>
                            <th>出险日期</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="related : ${relatedCases}">
                            <td th:text="${related.caseNo}"></td>
                            <td th:text="${related.accidentDate}"></td>
                            <td>
                                <span class="status-badge" th:class="'status-badge status-' + ${related.status}"
                                      th:text="${related.status == 'REGISTERED'} ? '已登记' : related.status">
                                </span>
                            </td>
                            <td><a th:href="@{/cases/{id}(id=${related.id})}" class="btn btn-sm btn-outline-primary">查看</a></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-header">核赔决定</div>
                <div class="card-body">
                    <form th:action="@{/review/approve}" method="post" class="mb-3">
                        <input type="hidden" name="caseId" th:value="${claimCase.id}">
                        <h6 class="text-success">同意赔付</h6>
                        <div class="mb-2">
                            <label class="form-label small">责任判断</label>
                            <textarea name="liabilityJudgment" class="form-control form-control-sm" rows="2" required
                                      placeholder="请说明责任认定依据"></textarea>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small">赔付金额（元）</label>
                            <input type="number" name="approvedAmount" step="0.01" class="form-control form-control-sm" required
                                   th:value="${claimCase.claimAmount}">
                        </div>
                        <div class="mb-2">
                            <label class="form-label small">备注</label>
                            <textarea name="remark" class="form-control form-control-sm" rows="1"></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100 btn-sm"
                                th:disabled="${claimCase.frozen}">
                            确认赔付
                        </button>
                    </form>

                    <hr>

                    <form th:action="@{/review/reject}" method="post" class="mb-3">
                        <input type="hidden" name="caseId" th:value="${claimCase.id}">
                        <h6 class="text-danger">拒赔</h6>
                        <div class="mb-2">
                            <label class="form-label small">拒赔原因</label>
                            <select name="rejectReason" class="form-select form-select-sm" required>
                                <option value="">请选择拒赔原因</option>
                                <option value="保单责任不符">保单责任不符</option>
                                <option value="未如实告知">未如实告知</option>
                                <option value="免责条款">属于免责条款范围</option>
                                <option value="证据不足">证据不足</option>
                                <option value="重复报案">重复报案</option>
                                <option value="其他">其他</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small">责任判断说明</label>
                            <textarea name="liabilityJudgment" class="form-control form-control-sm" rows="2"
                                      placeholder="请说明拒赔的法律或合同依据"></textarea>
                        </div>
                        <div class="mb-2">
                            <label class="form-label small">备注</label>
                            <textarea name="remark" class="form-control form-control-sm" rows="1"></textarea>
                        </div>
                        <button type="submit" class="btn btn-danger w-100 btn-sm"
                                th:disabled="${claimCase.frozen}">
                            确认拒赔
                        </button>
                    </form>

                    <hr>

                    <form th:action="@{/review/return}" method="post">
                        <input type="hidden" name="caseId" th:value="${claimCase.id}">
                        <h6 class="text-secondary">退回案件</h6>
                        <div class="mb-2">
                            <label class="form-label small">退回原因</label>
                            <input type="text" name="returnReason" class="form-control form-control-sm" required
                                   placeholder="例如：需补充事故证明材料">
                        </div>
                        <div class="mb-2">
                            <label class="form-label small">备注</label>
                            <textarea name="remark" class="form-control form-control-sm" rows="1"></textarea>
                        </div>
                        <button type="submit" class="btn btn-outline-secondary w-100 btn-sm"
                                th:disabled="${claimCase.frozen}">
                            退回案件
                        </button>
                    </form>
                </div>
            </div>

            <div class="mt-3 d-grid">
                <a th:href="@{/cases/{id}(id=${claimCase.id})}" class="btn btn-outline-primary">返回案件详情</a>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
