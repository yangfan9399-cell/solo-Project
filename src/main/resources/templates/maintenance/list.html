<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:replace="~{fragments/layout :: head('维修工单')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<div th:replace="~{fragments/layout :: alerts}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3><i class="bi bi-list-task"></i> 维修工单列表</h3>
        <a href="/maintenance/submit" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> 提交故障
        </a>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <form class="row g-3" method="get" action="/maintenance">
                <div class="col-md-3">
                    <label class="form-label">状态筛选</label>
                    <select class="form-select" name="status">
                        <option value="">全部状态</option>
                        <option th:each="s : ${statuses}"
                                th:value="${s.name()}"
                                th:text="${s.description}"
                                th:selected="${currentStatus != null and currentStatus.name() == s.name()}"></option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-search"></i> 筛选
                    </button>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <a href="/maintenance" class="btn btn-outline-secondary w-100">
                        <i class="bi bi-x-circle"></i> 重置
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>工单编号</th>
                        <th>房间</th>
                        <th>楼层/房型</th>
                        <th>故障类型</th>
                        <th>状态</th>
                        <th>提交人</th>
                        <th>维修人</th>
                        <th>停卖时长</th>
                        <th>提交时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}">
                        <td><span class="fw-bold" th:text="${order.orderNo}"></span></td>
                        <td>
                            <i class="bi bi-door-closed"></i>
                            <span th:text="${order.room.roomNumber}"></span>
                        </td>
                        <td>
                            <small class="text-muted">
                                <span th:text="${order.room.floor} + 'F / ' + ${order.room.roomType}"></span>
                            </small>
                        </td>
                        <td th:text="${order.faultType.description}"></td>
                        <td>
                            <span class="badge rounded-pill status-badge"
                                  th:class="'bg-' + ${#strings.toLowerCase(order.status.name())}"
                                  th:text="${order.status.description}"></span>
                        </td>
                        <td th:text="${order.reporter.name}"></td>
                        <td th:text="${order.engineer != null ? order.engineer.name : '-'}"></td>
                        <td>
                            <span th:if="${order.restoreTime != null}" class="text-success">
                                <i class="bi bi-clock"></i>
                                <span th:text="${T(java.time.Duration).between(order.outOfServiceTime, order.restoreTime).toHours() + 'h'}"></span>
                            </span>
                            <span th:unless="${order.restoreTime != null}" class="text-warning">
                                <i class="bi bi-clock-history"></i>
                                <span th:text="${T(java.time.Duration).between(order.outOfServiceTime, T(java.time.LocalDateTime).now()).toHours() + 'h'}"></span>
                            </span>
                        </td>
                        <td>
                            <small th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}"></small>
                        </td>
                        <td>
                            <a th:href="@{/maintenance/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-eye"></i> 详情
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(orders)}">
                        <td colspan="10" class="text-center py-5 text-muted">
                            <i class="bi bi-inbox display-4 d-block mb-2"></i>
                            暂无工单数据
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
