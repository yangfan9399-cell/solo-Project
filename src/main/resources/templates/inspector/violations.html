<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>违规记录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 20px; }
        .header a { color: white; text-decoration: none; }
        .sidebar { width: 200px; background: #2d3748; min-height: calc(100vh - 65px); padding-top: 20px; float: left; }
        .sidebar a { display: block; padding: 12px 20px; color: #a0aec0; text-decoration: none; transition: background 0.2s; }
        .sidebar a:hover { background: #4a5568; color: white; }
        .sidebar a.active { background: #667eea; color: white; }
        .main { margin-left: 220px; padding: 20px; }
        .card { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 20px; }
        .card-header { margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f7fafc; font-weight: 600; }
        .status { padding: 4px 12px; border-radius: 20px; font-size: 12px; }
        .status.pending { background: #fef3c7; color: #92400e; }
        .status.rectified { background: #dcfce7; color: #166534; }
        .status.suspended { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="header">
        <h1>农贸市场摊位管理平台</h1>
        <a href="/logout">退出登录</a>
    </div>
    
    <div class="sidebar">
        <a href="/dashboard">仪表盘</a>
        <a href="/inspector/stalls">摊位巡查</a>
        <a href="/inspector/violations" class="active">违规记录</a>
    </div>
    
    <div class="main">
        <div class="card">
            <div class="card-header">
                <h2>违规记录</h2>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>摊位编号</th>
                        <th>违规类型</th>
                        <th>描述</th>
                        <th>扣分</th>
                        <th>记录日期</th>
                        <th>状态</th>
                        <th>巡查员</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="violation : ${violations}">
                        <td th:text="${violation.stallId}"></td>
                        <td th:text="${violation.violationType}"></td>
                        <td th:text="${violation.description}"></td>
                        <td th:text="${violation.pointsDeducted}"></td>
                        <td th:text="${violation.recordDate}"></td>
                        <td><span th:class="['status', ${violation.status}]" th:text="${violation.status}"></span></td>
                        <td th:text="${violation.inspector}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
