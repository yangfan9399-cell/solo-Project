<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>按异常原因分析 - 工装夹具管控系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: _}"></div>

<div class="container">
    <div class="page-header">
        <h1 class="page-title">按异常原因分析</h1>
        <p class="page-subtitle">各类异常原因统计分析</p>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="get" style="display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label">开始日期</label>
                    <input type="date" name="startDate" class="form-control" th:value="${#temporals.format(startDate, 'yyyy-MM-dd')}">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label class="form-label">结束日期</label>
                    <input type="date" name="endDate" class="form-control" th:value="${#temporals.format(endDate, 'yyyy-MM-dd')}">
                </div>
                <button type="submit" class="btn btn-primary">查询</button>
            </form>
        </div>
    </div>

    <div class="tabs">
        <a href="/analysis" class="tab">总览</a>
        <a href="/analysis/by-production-line" class="tab">按产线</a>
        <a href="/analysis/by-exception" class="tab active">按异常原因</a>
        <a href="/analysis/downtime-impact" class="tab">停线影响</a>
    </div>

    <div class="two-column">
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">损坏类型分布</h3>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                    <tr>
                        <th>损坏类型</th>
                        <th>次数</th>
                        <th>占比</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="stat : ${stats.damageByType}">
                        <td th:text="${stat[0]}"></td>
                        <td th:text="${stat[1]}">0</td>
                        <td>-</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(stats.damageByType)}">
                        <td colspan="3" class="empty-state">
                            <div class="empty-state-text">暂无损坏记录</div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h3 class="card-title">校准结果统计</h3>
            </div>
            <div class="card-body">
                <table class="table">
                    <thead>
                    <tr>
                        <th>校准结果</th>
                        <th>数量</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="stat : ${stats.calibrationStats}">
                        <td th:text="${stat[0]}"></td>
                        <td th:text="${stat[1]}">0</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(stats.calibrationStats)}">
                        <td colspan="2" class="empty-state">
                            <div class="empty-state-text">暂无校准记录</div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h3 class="card-title">借用状态分布</h3>
        </div>
        <div class="card-body">
            <table class="table">
                <thead>
                <tr>
                    <th>状态</th>
                    <th>数量</th>
                    <th>占比</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="stat : ${stats.borrowStatusStats}">
                    <td th:text="${stat[0]}"></td>
                    <td th:text="${stat[1]}">0</td>
                    <td>-</td>
                </tr>
                <tr th:if="${#lists.isEmpty(stats.borrowStatusStats)}">
                    <td colspan="3" class="empty-state">
                        <div class="empty-state-text">暂无借用记录</div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: _}"></div>
</body>
</html>
