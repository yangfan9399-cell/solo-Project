<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报修派单 - 宿管端</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="header">
    <h1>校园宿舍报修系统 - 宿管端</h1>
    <div class="user-info">
        <span>欢迎，<span th:text="${currentUser.realName}"></span></span>
        <a href="/logout">退出</a>
    </div>
</div>

<div class="container">
    <div class="card">
        <h2>报修单管理</h2>

        <div class="filter-bar">
            <form method="get" action="/dorm-manager/repairs" style="display: flex; gap: 10px; align-items: flex-end;">
                <div class="form-group" style="margin-bottom: 0; min-width: 150px;">
                    <label>状态筛选</label>
                    <select name="status" onchange="this.form.submit()">
                        <option value="">全部状态</option>
                        <option th:each="s : ${statuses}"
                                th:value="${s.name()}"
                                th:text="${s.label}"
                                th:selected="${s == selectedStatus}"></option>
                    </select>
                </div>
            </form>
        </div>

        <div th:if="${param.error}" class="alert alert-error">
            <span th:text="${param.error}"></span>
        </div>

        <table>
            <thead>
            <tr>
                <th>报修单号</th>
                <th>楼栋/宿舍</th>
                <th>故障类型</th>
                <th>学生</th>
                <th>维修工</th>
                <th>状态</th>
                <th>提交时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="repair : ${repairs}">
                <td th:text="${repair.orderNo}"></td>
                <td th:text="${repair.building} + ' ' + ${repair.roomNo}"></td>
                <td th:text="${repair.faultType.label}"></td>
                <td th:text="${repair.studentName}"></td>
                <td th:text="${repair.repairmanName ?: '未派单'}"></td>
                <td>
                    <span class="status-badge"
                          th:class="'status-badge status-' + ${#strings.toLowerCase(repair.status.name())}"
                          th:text="${repair.status.label}"></span>
                </td>
                <td th:text="${#temporals.format(repair.submitTime, 'yyyy-MM-dd HH:mm')}"></td>
                <td>
                    <div style="display: flex; gap: 5px; flex-wrap: wrap;">
                        <a th:href="@{/dorm-manager/repair/{id}(id=${repair.id})}" class="btn btn-sm btn-default">详情</a>
                        <form th:if="${repair.status.name() == 'SUBMITTED'}" method="post"
                              th:action="@{/dorm-manager/assign/{id}(id=${repair.id})}"
                              style="display: inline;">
                            <select name="repairmanId" required onchange="this.form.submit()">
                                <option value="">派单</option>
                                <option th:each="r : ${repairmen}"
                                        th:value="${r.id}"
                                        th:text="${r.realName}"></option>
                            </select>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(repairs)}">
                <td colspan="8" style="text-align: center; color: #999;">暂无报修单</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
