
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影院放映设备巡检系统</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .sidebar {
            width: 200px;
            background: #1a1a2e;
            color: white;
            min-height: 100vh;
            padding: 20px;
            float: left;
        }
        .sidebar h2 {
            margin-top: 0;
            margin-bottom: 30px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        .sidebar a {
            display: block;
            color: #ccc;
            text-decoration: none;
            padding: 10px 0;
            transition: color 0.3s;
        }
        .sidebar a:hover, .sidebar a.active {
            color: white;
        }
        .content {
            margin-left: 240px;
            padding: 20px;
        }
        .header {
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        table th, table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        table th {
            background: #f5f5f5;
            font-weight: 600;
        }
        .btn {
            display: inline-block;
            padding: 8px 16px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 14px;
            transition: background 0.3s;
            border: none;
            cursor: pointer;
        }
        .btn:hover {
            background: #0056b3;
        }
        .btn-success {
            background: #28a745;
        }
        .btn-success:hover {
            background: #1e7e34;
        }
        .btn-danger {
            background: #dc3545;
        }
        .btn-danger:hover {
            background: #c82333;
        }
        .btn-secondary {
            background: #6c757d;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
        .status-normal {
            color: #28a745;
        }
        .status-abnormal {
            color: #ffc107;
        }
        .status-fault {
            color: #dc3545;
        }
        .card {
            background: white;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .form-group textarea {
            height: 100px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
        }
        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
        }
        .stat-card .label {
            opacity: 0.8;
        }
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .alert-danger {
            background: #f8d7da;
            color: #721c24;
        }
        .timeline {
            position: relative;
            padding-left: 30px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 10px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #ddd;
        }
        .timeline-item {
            position: relative;
            margin-bottom: 20px;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -24px;
            top: 5px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #007bff;
            border: 2px solid white;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>巡检管理系统</h2>
        <a th:href="@{/}" th:class="${activeMenu == 'dashboard' ? 'active' : ''}">数据看板</a>
        <a th:href="@{/screenings}" th:class="${activeMenu == 'screenings' ? 'active' : ''}">场次管理</a>
        <a th:href="@{/interrupts}" th:class="${activeMenu == 'interrupts' ? 'active' : ''}">中断记录</a>
        <a th:href="@{/compensations}" th:class="${activeMenu == 'compensations' ? 'active' : ''}">补偿管理</a>
    </div>
    <div class="content">
        <div class="header">
            <h1 th:text="${pageTitle}">页面标题</h1>
        </div>
        <div th:if="${error}" class="alert alert-danger">
            [[${error}]]
        </div>
        <div th:replace="${content}">内容区域</div>
    </div>
</body>
</html>
