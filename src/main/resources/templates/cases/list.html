<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案件管理 - 保险理赔系统</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">保险理赔材料补正与核赔复核系统</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/">首页</a></li>
                <li class="nav-item"><a class="nav-link active" href="/cases">案件管理</a></li>
                <li class="nav-item"><a class="nav-link" href="/cases/register">案件登记</a></li>
                <li class="nav-item"><a class="nav-link" href="/statistics">复盘统计</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>案件列表</h2>
        <a href="/cases/register" class="btn btn-primary">+ 登记新案件</a>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <div class="btn-group" role="group">
                <a href="/cases" class="btn btn-outline-primary"
                   th:classappend="${selectedStatus == null or selectedStatus == ''} ? 'active'">全部</a>
                <a href="/cases?status=REGISTERED" class="btn btn-outline-primary"
                   th:classappend="${selectedStatus == 'REGISTERED'} ? 'active'">已登记</a>
                <a href="/cases?status=PENDING_REVIEW" class="btn btn-outline-primary"
                   th:classappend="${selectedStatus == 'PENDING_REVIEW'} ? 'active'">待核赔</a>
                <a href="/cases?status=MATERIAL_MISSING" class="btn btn-outline-primary"
                   th:classappend="${selectedStatus == 'MATERIAL_MISSING'} ? 'active'">材料缺失</a>
                <a href="/cases?status=APPROVED" class="btn btn-outline-primary"
                   th:classappend="${selectedStatus == 'APPROVED'} ? 'active'">已赔付</a>
                <a href="/cases?status=REJECTED" class="btn btn-outline-primary"
                   th:classappend="${selectedStatus == 'REJECTED'} ? 'active'">已拒赔</a>
                <a href="/cases?status=RETURNED" class="btn btn-outline-primary"
                   th:classappend="${selectedStatus == 'RETURNED'} ? 'active'">已退回</a>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>案件号</th>
                    <th>报案人</th>
                    <th>出险日期</th>
                    <th>事故类型</th>
                    <th>索赔金额</th>
                    <th>状态</th>
                    <th>登记时间</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="claimCase : ${cases}">
                    <td>
                        <span th:if="${claimCase.frozen}" class="badge bg-purple me-1" style="background-color:#6f42c1">冻结</span>
                        <span th:if="${claimCase.isDuplicate}" class="badge bg-secondary me-1">重复</span>
                        <span th:text="${claimCase.caseNo}"></span>
                    </td>
                    <td th:text="${claimCase.reporterName}"></td>
                    <td th:text="${claimCase.accidentDate}"></td>
                    <td th:text="${claimCase.accidentType}"></td>
                    <td th:text="'¥' + ${#numbers.formatDecimal(claimCase.claimAmount, 1, 'COMMA', 2, 'DEFAULT')}"></td>
                    <td>
                        <span class="status-badge" th:class="'status-badge status-' + ${claimCase.status}"
                              th:text="${claimCase.status == 'REGISTERED'} ? '已登记' :
                                       (${claimCase.status == 'PENDING_REVIEW'} ? '待核赔' :
                                       (${claimCase.status == 'MATERIAL_MISSING'} ? '材料缺失' :
                                       (${claimCase.status == 'APPROVED'} ? '已赔付' :
                                       (${claimCase.status == 'REJECTED'} ? '已拒赔' :
                                       (${claimCase.status == 'RETURNED'} ? '已退回' : claimCase.status))))))">
                        </span>
                    </td>
                    <td th:text="${#temporals.format(claimCase.registerTime, 'yyyy-MM-dd HH:mm')}"></td>
                    <td>
                        <a th:href="@{/cases/{id}(id=${claimCase.id})}" class="btn btn-sm btn-outline-primary">详情</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(cases)}">
                    <td colspan="8" class="text-center py-4 text-muted">暂无案件数据</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
