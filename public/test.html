<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>测试</title>
  <script src="/vendor/react.js"></script>
  <script src="/vendor/react-dom.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    const e = React.createElement;
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e('div', { style: { padding: '20px', color: 'white', background: '#0f1621' } },
      '✅ React 本地加载成功！',
      e('p', null, 'React 版本: ' + React.version)
    ));
  </script>
</body>
</html>
