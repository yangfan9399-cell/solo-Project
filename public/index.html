<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>琉璃温室资源配给盘</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1 class="title">琉璃温室资源配给盘</h1>
      <div class="game-selector">
        <button class="game-tab" data-game="yi">乙局 · 教学</button>
        <button class="game-tab" data-game="ren">壬局 · 匮乏</button>
        <button class="game-tab" data-game="zi">子局 · 隐秘</button>
      </div>
    </header>

    <main class="main-content">
      <div class="left-panel">
        <section class="panel board-panel">
          <h2 class="panel-title">局面盘</h2>
          <div class="game-info">
            <span id="gameName" class="game-name">--</span>
            <span id="gameDifficulty" class="game-difficulty">--</span>
          </div>
          
          <div class="turn-indicator">
            <span>回合</span>
            <span id="turnDisplay" class="turn-number">1 / 8</span>
          </div>

          <div class="stats-grid">
            <div class="stat-card sealed">
              <div class="stat-label">琉璃温室封存值</div>
              <div class="stat-value" id="sealedValue">0</div>
              <div class="stat-bar">
                <div class="stat-bar-fill" id="sealedBar"></div>
              </div>
            </div>
            <div class="stat-card rewrite">
              <div class="stat-label">琉璃温室复写槽</div>
              <div class="stat-value" id="rewriteSlots">0</div>
            </div>
            <div class="stat-card translation">
              <div class="stat-label">琉璃温室转译痕</div>
              <div class="stat-value" id="translationTraces">0</div>
            </div>
            <div class="stat-card yi-risk">
              <div class="stat-label">乙号风险</div>
              <div class="stat-value" id="yiRisk">0</div>
              <div class="stat-bar danger">
                <div class="stat-bar-fill" id="yiRiskBar"></div>
              </div>
            </div>
            <div class="stat-card ren-reward">
              <div class="stat-label">壬号奖励</div>
              <div class="stat-value" id="renReward">0</div>
            </div>
            <div class="stat-card zi-failure">
              <div class="stat-label">子号失败因子</div>
              <div class="stat-value" id="ziFailure">0</div>
              <div class="stat-bar danger">
                <div class="stat-bar-fill" id="ziFailureBar"></div>
              </div>
            </div>
          </div>

          <div class="win-lose-info">
            <div class="win-condition">
              <span class="condition-label">胜利条件：</span>
              <span id="winCondition">--</span>
            </div>
            <div class="lose-condition">
              <span class="condition-label">失败条件：</span>
              <span id="loseCondition">--</span>
            </div>
          </div>

          <div class="map-container" id="mapContainer">
            <svg id="gameMap" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
            </svg>
          </div>
        </section>

        <section class="panel events-panel">
          <h2 class="panel-title">事件匣</h2>
          <div id="eventsList" class="events-list">
          </div>
        </section>
      </div>

      <div class="right-panel">
        <section class="panel replay-panel">
          <h2 class="panel-title">回放轴</h2>
          <div class="replay-controls">
            <button id="replayPrev" class="replay-btn">◀ 上一步</button>
            <button id="replayNext" class="replay-btn">下一步 ▶</button>
            <button id="replayCurrent" class="replay-btn primary">回到当前</button>
          </div>
          <div id="replayTimeline" class="replay-timeline">
          </div>
        </section>

        <section class="panel settlement-panel">
          <h2 class="panel-title">结算簿</h2>
          <div id="settlementContent" class="settlement-content">
            <p class="settlement-placeholder">游戏进行中...</p>
          </div>
          <button id="viewSettlementBtn" class="settlement-btn">查看结算</button>
          <button id="resetGameBtn" class="reset-btn">重置本局</button>
        </section>
      </div>
    </main>

    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <h3 id="modalTitle">提示</h3>
        <p id="modalMessage"></p>
        <button id="modalCloseBtn" class="modal-btn">确定</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
