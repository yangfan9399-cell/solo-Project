<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="wallBase3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a070;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#b89050;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9a7040;stop-opacity:1" />
    </linearGradient>
    <pattern id="stucco3" patternUnits="userSpaceOnUse" width="5" height="5">
      <rect width="5" height="5" fill="transparent"/>
      <circle cx="1" cy="2" r="0.35" fill="rgba(80,50,20,0.25)"/>
