<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="wallBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a674;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c4956a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a67c52;stop-opacity:1" />
    </linearGradient>
    <pattern id="stucco" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="4" fill="transparent"/>
      <circle cx="1" cy="1" r="0.3" fill="rgba(90,60,30,0.2)"/>
      <circle cx="3" cy="3" r="0.2" fill="rgba(100,70,40,0.15)"/>
    </pattern>
    <pattern id="crackPattern" patternUnits="userSpaceOnUse" width="200" height="200">
      <path d="M0,100 L80,95 L120,110 L200,100" stroke="rgba(90,50,20,0.25)" stroke-width="0.8" fill="none"/>
      <path d="M50,0 L55,60 L45,120 L60,200" stroke="rgba((90,50,20,0.2)" stroke-width="0.6" fill="none"/>
      <path d="M150,20 L145,80 L160,150 L155,200" stroke="rgba(90,50,20,0.18)" stroke-width="0.5" fill="none"/>
    </pattern>
    <radialGradient id="fading" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(0,0,0,0);stop-opacity:0"/>
      <stop offset="100%" style="stop-color:rgba(0,0,0,0.15);stop-opacity:1"/>
    </radialGradient>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#wallBase)"/>
  <rect width="1200" height="800" fill="url(#stucco)"/>
  <rect width="1200" height="800" fill="url(#crackPattern)"/>

  <g opacity="0.9" filter="url(#rough)">
    <rect x="100" y="80" width="1000" height="640" fill="rgba(210,170,110,0.3)"/>
    
    <g transform="translate(600, 180)">
      <ellipse cx="0" cy="-30" rx="60" ry="70" fill="#c4956a" stroke="#8b6914" stroke-width="2"/>
      <circle cx="-20" cy="-40" r="6" fill="#2c1810"/>
      <circle cx="20" cy="-40" r="6" fill="#2c1810"/>
      <path d="M-15,-15 Q0,0 15,-15" stroke="#5a3a1a" stroke-width="2.5" fill="none"/>
      <ellipse cx="0" cy="60" rx="90" ry="120" fill="#c44d3a" stroke="#8b1a1a" stroke-width="2"/>
      <path d="M-70,50 Q-60,80 -50,60 Q-40,40 -30,70 Q-20,90 -10,55 Q0,30 10,65 Q20,90 30,55 Q40,35 50,70 Q60,85 70,55" fill="none" stroke="#f5d76e" stroke-width="3"/>
      <ellipse cx="0" cy="180" rx="100" ry="40" fill="#8b4513" stroke="#5a2d0a" stroke-width="2"/>
      <circle cx="-80" cy="180" r="15" fill="#d4a574"/>
      <circle cx="80" cy="180" r="15" fill="#d4a574"/>
    </g>

    <g transform="translate(250, 350)">
      <ellipse cx="0" cy="-20" rx="35" ry="42" fill="#d4a674" stroke="#8b6914" stroke-width="1.5"/>
      <circle cx="-12" cy="-28" r="4" fill="#2c1810"/>
      <circle cx="12" cy="-28" r="4" fill="#2c1810"/>
      <path d="M-8,-8 Q0,0 8,-8" stroke="#5a3a1a" stroke-width="2" fill="none"/>
      <ellipse cx="0" cy="55" rx="55" ry="75" fill="#4a90d9" stroke="#1e4f8b" stroke-width="1.5"/>
      <circle cx="-15" cy="30" r="10" fill="#f5d76e"/>
      <circle cx="15" cy="50" r="8" fill="#f5d76e"/>
      <circle cx="0" cy="80" r="12" fill="#f5d76e"/>
    </g>

    <g transform="translate(950, 350)">
      <ellipse cx="0" cy="-20" rx="35" ry="42" fill="#d4a674" stroke="#8b6914" stroke-width="1.5"/>
      <circle cx="-12" cy="-28" r="4" fill="#2c1810"/>
      <circle cx="12" cy="-28" r="4" fill="#2c1810"/>
      <path d="M-8,-8 Q0,0 8,-8" stroke="#5a3a1a" stroke-width="2" fill="none"/>
      <ellipse cx="0" cy="55" rx="55" ry="75" fill="#5aab5a" stroke="#2e6b2e" stroke-width="1.5"/>
      <path d="M-30,30 L-10,50 L-30,70 Z" fill="#f5d76e" stroke="#c4a510" stroke-width="1"/>
      <path d="M30,30 L10,50 L30,70 Z" fill="#f5d76e" stroke="#c4a510" stroke-width="1"/>
    </g>

    <g stroke="#8b6914" stroke-width="2" fill="none">
      <rect x="120" y="530" width="960" height="170" rx="4"/>
      <line x1="280" y1="530" x2="280" y2="700"/>
      <line x1="440" y1="530" x2="440" y2="700"/>
      <line x1="600" y1="530" x2="600" y2="700"/>
      <line x1="760" y1="530" x2="760" y2="700"/>
      <line x1="920" y1="530" x2="920" y2="700"/>
    </g>

    <g font-family="serif" fill="#5a3a1a">
      <text x="180" y="600" font-size="18" text-anchor="middle">鹿</text>
      <text x="340" y="600" font-size="18" text-anchor="middle">王</text>
      <text x="500" y="600" font-size="18" text-anchor="middle">本</text>
      <text x="680" y="600" font-size="18" text-anchor="middle">生</text>
      <text x="840" y="600" font-size="18" text-anchor="middle">经</text>
      <text x="1000" y="600" font-size="18" text-anchor="middle">变</text>
    </g>

    <g>
      <ellipse cx="150" cy="500" rx="30" ry="20" fill="rgba(255,200,100,0.6)"/>
      <ellipse cx="450" cy="520" rx="25" ry="18" fill="rgba(255,200,100,0.5)"/>
      <ellipse cx="750" cy="510" rx="35" ry="22" fill="rgba(255,200,100,0.55)"/>
      <ellipse cx="1050" cy="530" rx="28" ry="16" fill="rgba(255,200,100,0.45)"/>
    </g>
  </g>

  <g opacity="0.7">
    <path d="M80,0 L90,200 L75,400 L95,600 L85,800" stroke="rgba(100,70,40,0.4)" stroke-width="3" fill="none"/>
    <path d="M400,0 L390,150 L410,350 L395,550 L405,800" stroke="rgba(100,70,40,0.3)" stroke-width="2" fill="none"/>
    <path d="M850,0 L860,180 L845,380 L865,580 L855,800" stroke="rgba(100,70,40,0.35)" stroke-width="2.5" fill="none"/>
    <path d="M1100,0 L1090,220 L1105,420 L1088,620 L1095,800" stroke="rgba(100,70,40,0.25)" stroke-width="2" fill="none"/>
  </g>

  <g opacity="0.35">
    <ellipse cx="200" cy="100" rx="60" ry="30" fill="rgba(120,100,80,0.5)"/>
    <ellipse cx="980" cy="120" rx="80" ry="35" fill="rgba(120,100,80,0.45)"/>
    <ellipse cx="600" cy="750" rx="150" ry="40" fill="rgba(120,100,80,0.4)"/>
  </g>

  <rect width="1200" height="800" fill="url(#fading)"/>
</svg>
