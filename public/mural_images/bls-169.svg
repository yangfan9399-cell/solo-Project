  <g opacity="0.45">
    <path d="M500,100 L520,400 L490,600 L510,750" stroke="rgba(50,25,10,0.5)" stroke-width="2.5" fill="none"/>
    <path d="M700,80 L685,380 L710,580 L690,750" stroke="rgba(50,25,10,0.45)" stroke-width="2" fill="none"/>
    <ellipse cx="400" cy="350" rx="60" ry="35" fill="rgba(255,255,255,0.3)"/>
    <ellipse cx="820" cy="380" rx="50" ry="30" fill="rgba(255,255,255,0.25)"/>
    <ellipse cx="600" cy="700" rx="80" ry="40" fill="rgba(30,15,5,0.35)"/>
  </g>

  <polygon points="0,0 0,800 150,720 150,80" fill="rgba(40,20,10,0.45)"/>
  <polygon points="1200,0 1200,800 1050,720 1050,80" fill="rgba(40,20,10,0.45)"/>
