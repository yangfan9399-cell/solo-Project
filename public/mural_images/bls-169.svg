<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="wallBase5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c8a070;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#b08850;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#906838;stop-opacity:1" />
    </linearGradient>
    <pattern id="rock" patternUnits="userSpaceOnUse" width="15" height="15">
      <rect width="15" height="15" fill="transparent"/>
      <path d="M0,7 L15,8" stroke="rgba(60,30,10,0.3)" stroke-width="0.6" fill="none"/>
      <path d="M5,0 L6,15" stroke="rgba(60,30,10,0.25)" stroke-width="0.5" fill="none"/>
      <path d="M10,0 L9,15" stroke="rgba(60,30,10,0.2)" stroke-width="0.4" fill="none"/>
    </pattern>
    <radialGradient id="caveLight" cx="50%" cy="20%" r="70%">
      <stop offset="0%" style="stop-color:rgba(255,240,200,0.25);stop-opacity:1"/>
      <stop offset="100%" style="stop-color:rgba(20,10,5,0.4);stop-opacity:1"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#wallBase5)"/>
  <rect width="1200" height="800" fill="url(#rock)"/>
  <rect width="1200" height="800" fill="url(#caveLight)"/>

  <g opacity="0.9">
    <path d="M150,80 Q100,400 150,720 L1050,720 Q1100,400 1050,80 Z" fill="rgba(200,160,110,0.3)" stroke="#5a3818" stroke-width="3"/>

    <g transform="translate(600, 230)">
      <path d="M-130,-80 L-80,-120 Q0,-140 80,-120 L130,-80 L150,50 L130,180 Q100,220 0,230 Q-100,220 -130,180 L-150,50 Z" fill="#3a2818" stroke="#1a1008" stroke-width="2"/>
      <path d="M-100,-60 L-60,-90 Q0,-100 60,-90 L100,-60 L120,40 L100,140 Q70,160 0,165 Q-70,160 -100,140 L-120,40 Z" fill="#5a4028" stroke="#2a1808" stroke-width="2"/>
      <ellipse cx="0" cy="-20" rx="50" ry="60" fill="#d4a674" stroke="#6a4020" stroke-width="2"/>
      <path d="M-50,-45 Q0,-75 50,-45 L55,-20 Q40,-30 0,-35 Q-40,-30 -55,-20 Z" fill="#1a0a00"/>
      <circle cx="-18" cy="-30" r="6" fill="#1a0a00"/>
      <circle cx="18" cy="-30" r="6" fill="#1a0a00"/>
      <circle cx="-18" cy="-30" r="2" fill="white"/>
      <circle cx="18" cy="-30" r="2" fill="white"/>
      <path d="M-12,-5 Q0,3 12,-5" stroke="#4a2a10" stroke-width="2.5" fill="none"/>
      <path d="M-35,30 Q-20,10 -5,30 Q10,50 30,25" stroke="#4a2a10" stroke-width="3" fill="none"/>
    </g>

    <g transform="translate(240, 400)">
      <rect x="-60" y="-100" width="120" height="200" fill="#4a3020" stroke="#2a1808" stroke-width="2" rx="3"/>
      <line x1="-60" y1="-50" x2="60" y2="-50" stroke="#2a1808" stroke-width="2"/>
      <line x1="-60" y1="0" x2="60" y2="0" stroke="#2a1808" stroke-width="2"/>
      <line x1="-60" y1="50" x2="60" y2="50" stroke="#2a1808" stroke-width="2"/>
      <text x="0" y="-75" fill="#e8c068" font-size="14" font-family="serif" text-anchor="middle">建</text>
      <text x="0" y="-25" fill="#e8c068" font-size="14" font-family="serif" text-anchor="middle">弘</text>
      <text x="0" y="25" fill="#e8c068" font-size="14" font-family="serif" text-anchor="middle">元</text>
      <text x="0" y="75" fill="#e8c068" font-size="14" font-family="serif" text-anchor="middle">年</text>
    </g>

    <g transform="translate(960, 400)">
      <rect x="-60" y="-100" width="120" height="200" fill="#4a3020" stroke="#2a1808" stroke-width="2" rx="3"/>
      <line x1="-60" y1="-50" x2="60" y2="-50" stroke="#2a1808" stroke-width="2"/>
      <line x1="-60" y1="0" x2="60" y2="0" stroke="#2a1808" stroke-width="2"/>
      <line x1="-60" y1="50" x2="60" y2="50" stroke="#2a1808" stroke-width="2"/>
      <text x="0" y="-75" fill="#e8c068" font-size="14" font-family="serif" text-anchor="middle">題</text>
      <text x="0" y="-25" fill="#e8c068" font-size="14" font-family="serif" text-anchor="middle">記</text>
      <text x="0" y="25" fill="#e8c068" font-size="14" font-family="serif" text-anchor="middle">碑</text>
      <text x="0" y="75" fill="#e8c068" font-size="14" font-family="serif" text-anchor="middle">銘</text>
    </g>

    <g transform="translate(600, 520)">
      <ellipse cx="0" cy="0" rx="180" ry="70" fill="#d4c4a4" stroke="#8b6914" stroke-width="2"/>
      <path d="M-140,0 Q-100,-40 -60,-15 Q-20,10 20,-50 Q60,10 100,-15 Q140,-40 140,0" fill="none" stroke="#c44d3a" stroke-width="5"/>
      <path d="M-120,20 Q-80,-15 -40,10 Q0,30 40,-25 Q80,15 120,-10 Q140,-25 120,20" fill="none" stroke="#4a90d9" stroke-width="4"/>
    </g>

    <g font-family="serif" fill="#2a1008">
      <text x="600" y="100" font-size="20" font-weight="bold" text-anchor="middle">炳 靈 寺 第 一 百 六 十 九 窟</text>
      <text x="600" y="130" font-size="14" text-anchor="middle">· 西 秦 建 弘 元 年 題 記 · 我 國 最 早 有 明 確 紀 年 之 石 窟 壁 畫 ·</text>
    </g>
