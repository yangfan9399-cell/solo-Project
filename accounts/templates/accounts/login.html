<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>入境动物隔离观察与放行系统 - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans SC', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-[#1e3a5f] to-[#2d5a87] flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-xl shadow-2xl overflow-hidden">
            <div class="bg-[#1e3a5f] px-8 py-6 text-center">
                <h1 class="text-2xl font-bold text-white">入境动物隔离观察与放行系统</h1>
                <p class="text-[#f59e0b] mt-2 text-sm">检疫管理平台</p>
            </div>
            
            <div class="px-8 py-8">
                {% if messages %}
                    {% for message in messages %}
                        <div class="mb-4 p-3 rounded-lg {% if message.tags == 'success' %}bg-green-100 text-green-700{% elif message.tags == 'error' %}bg-red-100 text-red-700{% else %}bg-blue-100 text-blue-700{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
                
                <form method="post" action="{% url 'accounts:login' %}" class="space-y-6">
                    {% csrf_token %}
                    
                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-700 mb-2">用户名</label>
                        <input type="text" 
                               id="username" 
                               name="username" 
                               required
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#1e3a5f] focus:border-transparent transition-all"
                               placeholder="请输入用户名">
                    </div>
                    
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">密码</label>
                        <input type="password" 
                               id="password" 
                               name="password" 
                               required
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[#1e3a5f] focus:border-transparent transition-all"
                               placeholder="请输入密码">
                    </div>
                    
                    <button type="submit" 
                            class="w-full bg-[#1e3a5f] text-white py-3 rounded-lg font-medium hover:bg-[#2d5a87] transition-all transform hover:scale-[1.02] active:scale-[0.98]">
                        登录
                    </button>
                </form>
                
                <div class="mt-6 pt-6 border-t border-gray-200">
                    <p class="text-sm text-gray-600 text-center">测试账号：</p>
                    <div class="mt-2 grid grid-cols-2 gap-2 text-xs text-gray-500">
                        <div class="bg-gray-50 p-2 rounded">
                            <p><strong>检疫员:</strong> inspector1</p>
                        </div>
                        <div class="bg-gray-50 p-2 rounded">
                            <p><strong>场员:</strong> staff1</p>
                        </div>
                        <div class="bg-gray-50 p-2 rounded">
                            <p><strong>兽医:</strong> vet1</p>
                        </div>
                        <div class="bg-gray-50 p-2 rounded">
                            <p><strong>监管:</strong> supervisor1</p>
                        </div>
                    </div>
                    <p class="text-xs text-gray-400 text-center mt-2">密码: password123</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
