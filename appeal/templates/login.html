<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>骑手申诉扣罚与证据复核系统 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-box { background: #fff; border-radius: 1rem; padding: 2rem; width: 100%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .login-box h1 { text-align: center; margin-bottom: 1.5rem; color: #1f2937; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: #374151; }
        .form-group input { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.5rem; font-size: 1rem; }
        .form-group input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.2); }
        .btn { width: 100%; padding: 0.75rem; border-radius: 0.5rem; font-weight: 500; cursor: pointer; border: none; font-size: 1rem; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .error { background: #fee2e2; color: #dc2626; padding: 0.75rem; border-radius: 0.375rem; margin-bottom: 1rem; }
        .credentials { margin-top: 1.5rem; padding: 1rem; background: #f3f4f6; border-radius: 0.5rem; font-size: 0.875rem; color: #4b5563; }
        .credentials h3 { margin-bottom: 0.5rem; font-weight: 600; }
        .credentials ul { list-style: none; padding-left: 0; }
        .credentials li { margin-bottom: 0.25rem; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>骑手申诉扣罚与证据复核系统</h1>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary">登录</button>
        </form>
        <div class="credentials">
            <h3>测试账号</h3>
            <ul>
                <li>管理员: manager / 123456</li>
                <li>站长: station_master / 123456</li>
                <li>仲裁员: arbitrator / 123456</li>
                <li>骑手1: rider_zhang / 123456</li>
                <li>骑手2: rider_li / 123456</li>
            </ul>
        </div>
    </div>
</body>
</html>
