<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>琉璃温室双人机关局</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>琉璃温室双人机关局</h1>
      <p class="subtitle">协作闯关 · 琉璃描线 · 机关解密</p>
    </header>

    <section id="level-select" class="level-select hidden">
      <h2>选择关卡</h2>
      <div class="level-cards" id="level-cards"></div>
    </section>

    <section id="game-area" class="game-area hidden">
      <div class="game-topbar">
        <div class="level-info">
          <span id="level-name">--</span>
          <span id="level-difficulty" class="difficulty">--</span>
        </div>
        <div class="turn-info">
          回合: <span id="turn-count">0</span>
        </div>
        <button id="btn-back" class="btn-ghost">返回选关</button>
      </div>

      <div class="game-main">
        <div class="game-left">
          <div class="panel">
            <h3 class="panel-title">局面盘 · <span id="level-label">--</span></h3>
            <div class="board-container">
              <div id="game-board" class="game-board"></div>
            </div>
            <div class="board-legend">
              <span class="legend-item"><span class="legend-cell legend-player1"></span>玩家1</span>
              <span class="legend-item"><span class="legend-cell legend-player2"></span>玩家2</span>
              <span class="legend-item"><span class="legend-cell legend-crystal"></span>琉璃晶</span>
              <span class="legend-item"><span class="legend-cell legend-switch"></span>开关</span>
              <span class="legend-item"><span class="legend-cell legend-door"></span>门(闭)</span>
              <span class="legend-item"><span class="legend-cell legend-door-open"></span>门(开)</span>
              <span class="legend-item"><span class="legend-cell legend-goal"></span>出口</span>
              <span class="legend-item"><span class="legend-cell legend-wall"></span>墙</span>
            </div>
            <div id="mechanism-status" class="mechanism-status"></div>
            <div class="player-stats">
              <div class="player-stat player1">
                <span class="player-label">玩家1</span>
                <span class="stat-item">💎 <span id="p1-crystals">0</span></span>
              </div>
              <div class="player-stat player2">
                <span class="player-label">玩家2</span>
                <span class="stat-item">💎 <span id="p2-crystals">0</span></span>
              </div>
            </div>
          </div>

          <div class="panel">
            <h3 class="panel-title">操作</h3>
            <div class="controls">
              <div class="control-group">
                <label>当前玩家:</label>
                <div class="player-toggle">
                  <button id="btn-p1" class="btn-toggle active">玩家1</button>
                  <button id="btn-p2" class="btn-toggle">玩家2</button>
                </div>
              </div>
              <div class="dpad">
                <button class="dpad-btn" data-dir="up">↑</button>
                <div class="dpad-row">
                  <button class="dpad-btn" data-dir="left">←</button>
                  <button class="dpad-btn dpad-center">·</button>
                  <button class="dpad-btn" data-dir="right">→</button>
                </div>
                <button class="dpad-btn" data-dir="down">↓</button>
              </div>
              <p class="hint">键盘 WASD / 方向键 移动，数字键 1/2 切换玩家</p>
            </div>
          </div>
        </div>

        <div class="game-center">
          <div class="panel">
            <h3 class="panel-title">事件匣</h3>
            <div id="events-container" class="events-container"></div>
          </div>

          <div class="panel">
            <h3 class="panel-title">局面字段</h3>
            <div class="stats-grid">
              <div class="stat-card">
                <span class="stat-label">琉璃温室描线值</span>
                <span class="stat-value line-value" id="stat-line">10</span>
              </div>
              <div class="stat-card">
                <span class="stat-label">琉璃温室量测槽</span>
                <span class="stat-value measure-slot" id="stat-measure">3</span>
              </div>
              <div class="stat-card">
                <span class="stat-label">琉璃温室配平痕</span>
                <span class="stat-value balance-mark" id="stat-balance">5</span>
              </div>
              <div class="stat-card">
                <span class="stat-label">戊号风险</span>
                <span class="stat-value wu-risk" id="stat-wu">2</span>
              </div>
              <div class="stat-card">
                <span class="stat-label">丁号奖励</span>
                <span class="stat-value ding-reward" id="stat-ding">0</span>
              </div>
              <div class="stat-card">
                <span class="stat-label">未号失败因子</span>
                <span class="stat-value wei-fail" id="stat-wei">0</span>
              </div>
            </div>
          </div>
        </div>

        <div class="game-right">
          <div class="panel">
            <h3 class="panel-title">回放轴</h3>
            <div id="replay-container" class="replay-container">
              <div id="replay-timeline" class="replay-timeline"></div>
            </div>
            <div class="replay-controls">
              <button id="btn-replay-start" class="btn-small">⏮ 最初</button>
              <button id="btn-replay-prev" class="btn-small">◀ 上一步</button>
              <button id="btn-replay-resume" class="btn-small">▶ 继续</button>
              <button id="btn-replay-next" class="btn-small">下一步 ▶</button>
            </div>
          </div>

          <div class="panel">
            <h3 class="panel-title">结算簿</h3>
            <div id="result-container" class="result-container">
              <p class="result-placeholder">尚未结算</p>
            </div>
            <button id="btn-settle" class="btn-primary btn-block">结算本局</button>
          </div>
        </div>
      </div>
    </section>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
