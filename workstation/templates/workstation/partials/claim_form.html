<div class="p-6">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold text-gray-800">报告领取登记</h2>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </div>

    <div class="mb-4 p-4 bg-gray-50 rounded-lg">
        <div class="text-sm text-gray-600">
            <span class="font-medium">预约编号:</span> {{ appointment.appointment_no }}
        </div>
        <div class="text-sm text-gray-600 mt-1">
            <span class="font-medium">患者姓名:</span> {{ appointment.patient.name }}
        </div>
        <div class="text-sm text-gray-600 mt-1">
            <span class="font-medium">患者身份证:</span> {{ appointment.patient.id_card }}
        </div>
        <div class="text-sm text-gray-600 mt-1">
            <span class="font-medium">检查类型:</span> {{ appointment.examination_type.name }}
        </div>
    </div>

    <form hx-post="{% url 'workstation:claim_report' appointment.id %}" hx-target="closest #modal-content">
        {% csrf_token %}
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">领取方式 *</label>
                <select name="claim_type" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                        x-model="claimType">
                    <option value="">请选择领取方式</option>
                    <option value="self">本人领取</option>
                    <option value="authorized">授权领取</option>
                    <option value="mail">邮寄</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">领取人姓名 *</label>
                <input type="text" 
                       name="claimant_name" 
                       required
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="请输入领取人姓名">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">领取人身份证号 *</label>
                <input type="text" 
                       name="claimant_id_card" 
                       required
                       maxlength="18"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="请输入18位身份证号">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">领取人联系电话 *</label>
                <input type="tel" 
                       name="claimant_phone" 
                       required
                       maxlength="11"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                       placeholder="请输入11位手机号">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">佐证材料</label>
                <textarea name="evidence" rows="2"
                          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                          placeholder="请输入佐证信息，如证件核验情况等..."></textarea>
            </div>

            <div class="p-3 bg-yellow-50 rounded-lg">
                <div class="text-sm text-yellow-800">
                    <span class="font-medium">温馨提示：</span>
                    本人领取需核验身份证原件；授权领取需核验双方身份证原件及授权委托书。
                </div>
            </div>
        </div>

        <div class="flex justify-end gap-3 mt-6">
            <button type="button" onclick="closeModal()"
                    class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50">
                取消
            </button>
            <button type="submit"
                    class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
                确认领取
            </button>
        </div>
    </form>
</div>
