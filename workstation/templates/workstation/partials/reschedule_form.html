<div class="p-6">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold text-gray-800">预约改期</h2>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </div>

    <div class="mb-4 p-4 bg-gray-50 rounded-lg">
        <div class="text-sm text-gray-600">
            <span class="font-medium">预约编号:</span> {{ appointment.appointment_no }}
        </div>
        <div class="text-sm text-gray-600 mt-1">
            <span class="font-medium">患者:</span> {{ appointment.patient.name }}
        </div>
        <div class="text-sm text-gray-600 mt-1">
            <span class="font-medium">当前预约时间:</span> {{ appointment.current_appointment_time|date:"Y-m-d H:i" }}
        </div>
    </div>

    <form hx-post="{% url 'workstation:reschedule_appointment' appointment.id %}" hx-target="this">
        {% csrf_token %}
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">新预约时间 *</label>
                <input type="datetime-local" 
                       name="new_time" 
                       required
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">改期原因 *</label>
                <select name="reason" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="">请选择原因</option>
                    <option value="patient">患者原因</option>
                    <option value="hospital">医院原因</option>
                    <option value="other">其他原因</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">详细原因</label>
                <textarea name="reason_detail" rows="3"
                          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                          placeholder="请输入详细原因..."></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">佐证材料/证据</label>
                <textarea name="evidence" rows="2"
                          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                          placeholder="请输入佐证信息..."></textarea>
            </div>
        </div>

        <div class="flex justify-end gap-3 mt-6">
            <button type="button" onclick="closeModal()"
                    class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50">
                取消
            </button>
            <button type="submit"
                    class="px-4 py-2 bg-yellow-600 text-white rounded-lg hover:bg-yellow-700">
                确认改期
            </button>
        </div>
    </form>
</div>
