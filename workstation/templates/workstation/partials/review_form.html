<div class="p-6">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold text-gray-800">报告领取复核</h2>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
    </div>

    <div class="mb-4 p-4 bg-gray-50 rounded-lg">
        <div class="text-sm text-gray-600">
            <span class="font-medium">预约编号:</span> {{ claim_record.appointment.appointment_no }}
        </div>
        <div class="text-sm text-gray-600 mt-1">
            <span class="font-medium">领取人:</span> {{ claim_record.claimant_name }}
        </div>
        <div class="text-sm text-gray-600 mt-1">
            <span class="font-medium">领取方式:</span> {{ claim_record.get_claim_type_display }}
        </div>
        <div class="text-sm text-gray-600 mt-1">
            <span class="font-medium">验证结果:</span> 
            <span class="{% if claim_record.verification_result == 'match' %}text-green-600{% else %}text-red-600{% endif %}">
                {{ claim_record.get_verification_result_display }}
            </span>
        </div>
        <div class="text-sm text-gray-600 mt-1">
            <span class="font-medium">经办人:</span> {{ claim_record.operator.username }}
        </div>
    </div>

    <form hx-post="{% url 'workstation:review_claim' claim_record.id %}" hx-target="this">
        {% csrf_token %}
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">复核操作 *</label>
                <div class="flex gap-4">
                    <label class="flex items-center">
                        <input type="radio" name="action" value="approve" required
                               class="mr-2 text-green-600">
                        <span class="text-green-700">确认通过</span>
                    </label>
                    <label class="flex items-center">
                        <input type="radio" name="action" value="reject" required
                               class="mr-2 text-red-600">
                        <span class="text-red-700">退回</span>
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">复核意见 *</label>
                <textarea name="review_notes" rows="3" required
                          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                          placeholder="请输入复核意见..."></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">佐证材料</label>
                <textarea name="evidence" rows="2"
                          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                          placeholder="请输入复核佐证信息..."></textarea>
            </div>
        </div>

        <div class="flex justify-end gap-3 mt-6">
            <button type="button" onclick="closeModal()"
                    class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50">
                取消
            </button>
            <button type="submit"
                    class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">
                提交复核
            </button>
        </div>
    </form>
</div>
