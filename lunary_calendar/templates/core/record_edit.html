{% extends 'core/base.html' %}

{% block title %}{% if record %}编辑记录{% else %}新建记录{% endif %} - 极简农历历法推算工具{% endblock %}

{% block content %}
    <div class="card">
        <div class="card-header">
            <h2>{% if record %}编辑记录{% else %}新建记录{% endif %}</h2>
            <a href="{% url 'index' %}" class="btn btn-secondary">返回列表</a>
        </div>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="form-row">
                <div class="form-group">
                    <label>标题</label>
                    <input type="text" name="title" value="{{ record.title|default:'' }}" required>
                </div>
                <div class="form-group">
                    <label>地点名称</label>
                    <input type="text" name="location_name" value="{{ record.location_name|default:'' }}">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>目标日期</label>
                    <input type="date" name="target_date" value="{{ record.target_date|default:'' }}" required>
                </div>
                <div class="form-group">
                    <label>时间(时)</label>
                    <input type="number" name="time_hour" value="{{ record.time_hour|default:12 }}" min="0" max="23">
                </div>
                <div class="form-group">
                    <label>时间(分)</label>
                    <input type="number" name="time_minute" value="{{ record.time_minute|default:0 }}" min="0" max="59">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>纬度</label>
                    <input type="number" step="0.000001" name="latitude" value="{{ record.latitude|default:39.9042 }}">
                </div>
                <div class="form-group">
                    <label>经度</label>
                    <input type="number" step="0.000001" name="longitude" value="{{ record.longitude|default:116.4074 }}">
                </div>
                <div class="form-group">
                    <label>时区</label>
                    <input type="number" name="timezone" value="{{ record.timezone_offset|default:8 }}" min="-12" max="14">
                </div>
            </div>
            
            <div class="form-group">
                <label>描述</label>
                <textarea name="description" rows="3">{{ record.description|default:'' }}</textarea>
            </div>
            
            <div class="action-buttons">
                <button type="submit" class="btn btn-primary">保存</button>
                <button type="submit" name="calculate" value="1" class="btn btn-success">保存并推算</button>
                <a href="{% url 'index' %}" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </div>
{% endblock %}
