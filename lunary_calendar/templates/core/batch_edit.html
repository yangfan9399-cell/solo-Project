{% extends 'core/base.html' %}

{% block title %}{% if batch %}编辑批次{% else %}新建批次{% endif %} - 极简农历历法推算工具{% endblock %}

{% block content %}
    <div class="card">
        <div class="card-header">
            <h2>{% if batch %}编辑批次{% else %}新建批次{% endif %}</h2>
            <a href="{% url 'index' %}" class="btn btn-secondary">返回列表</a>
        </div>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="form-row">
                <div class="form-group">
                    <label>批次名称</label>
                    <input type="text" name="name" value="{{ batch.name|default:'' }}" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>开始日期</label>
                    <input type="date" name="start_date" value="{{ batch.start_date|default:'' }}" required>
                </div>
                <div class="form-group">
                    <label>结束日期</label>
                    <input type="date" name="end_date" value="{{ batch.end_date|default:'' }}" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>纬度</label>
                    <input type="number" step="0.000001" name="latitude" value="{{ batch.latitude|default:39.9042 }}">
                </div>
                <div class="form-group">
                    <label>经度</label>
                    <input type="number" step="0.000001" name="longitude" value="{{ batch.longitude|default:116.4074 }}">
                </div>
                <div class="form-group">
                    <label>时区</label>
                    <input type="number" name="timezone" value="{{ batch.timezone_offset|default:8 }}" min="-12" max="14">
                </div>
            </div>
            
            <div class="form-group">
                <label>描述</label>
                <textarea name="description" rows="3">{{ batch.description|default:'' }}</textarea>
            </div>
            
            <div class="action-buttons">
                <button type="submit" class="btn btn-primary">保存</button>
                <a href="{% url 'index' %}" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </div>
{% endblock %}
